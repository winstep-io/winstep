<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>winstep — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c0b; --bg2:#0d1412; --bg3:#111a18; --bg4:#162220;
  --teal:#2ec4b6; --teal2:#1a9e90; --teal3:rgba(46,196,182,.12); --teal4:rgba(46,196,182,.06);
  --gold:#f5c842;
  --red:#e63946;
  --text:#e8f0ee; --muted:#4a6660;
  --border:rgba(46,196,182,.1); --border2:rgba(46,196,182,.2);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden}
.glow{position:fixed;top:-150px;left:50%;transform:translateX(-50%);width:600px;height:500px;background:radial-gradient(ellipse,rgba(46,196,182,.06),transparent 70%);pointer-events:none;z-index:0}
.auth-wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:24px;position:relative;z-index:1}
.logo{display:flex;flex-direction:column;align-items:center;gap:12px}
.logo-badge{width:62px;height:62px;background:var(--teal);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(46,196,182,.35)}
.logo-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.9rem;letter-spacing:-.01em;line-height:1}
.logo-name,.logo-name *{color:var(--text)}
.logo-name span{color:var(--teal)}
.logo-tagline{font-family:'Rajdhani',sans-serif;font-size:.6rem;letter-spacing:.4em;color:var(--muted);text-transform:uppercase;margin-top:-6px}
.auth-card{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:4px}
.tab{flex:1;padding:10px;border:none;background:none;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.88rem;font-weight:600;letter-spacing:.05em;cursor:pointer;border-radius:9px;transition:all .2s}
.tab.active{background:var(--teal3);color:var(--teal)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;background:#fff;border:none;border-radius:11px;font-family:'Rajdhani',sans-serif;font-size:.92rem;font-weight:600;color:#1a1a1a;cursor:pointer;transition:all .2s}
.google-btn:hover{background:#f0f0f0;transform:translateY(-1px)}
.google-icon{width:20px;height:20px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.input-group{display:flex;flex-direction:column;gap:6px}
.input-label{font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.input-field{width:100%;padding:13px 15px;background:var(--bg);border:1.5px solid var(--border);border-radius:11px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:.95rem;transition:all .2s}
.input-field::placeholder{color:var(--muted)}
.input-field:focus{outline:none;border-color:var(--teal2);background:var(--bg3)}
.input-hint{font-size:.66rem;color:var(--muted);letter-spacing:.03em}
.submit-btn{width:100%;padding:14px;background:var(--teal);border:none;border-radius:12px;color:#000;font-family:'Rajdhani',sans-serif;font-size:.98rem;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:all .2s;margin-top:4px}
.submit-btn:hover{background:#44ffe8;box-shadow:0 4px 24px rgba(46,196,182,.3);transform:translateY(-1px)}
.submit-btn:disabled{background:var(--bg4);color:var(--muted);cursor:not-allowed;box-shadow:none;transform:none}
.auth-note{font-size:.74rem;color:var(--muted);text-align:center;line-height:1.5}
.auth-note a{color:var(--teal);text-decoration:none;cursor:pointer}
.auth-note a:hover{text-decoration:underline}
.username-status{font-size:.66rem;letter-spacing:.03em;display:none}
.username-status.available{color:var(--teal);display:block}
.username-status.taken{color:var(--red);display:block}
.forgot-row{display:flex;justify-content:flex-end;margin-top:-6px}
.forgot-link{font-size:.74rem;color:var(--muted);text-decoration:none;letter-spacing:.03em;cursor:pointer}
.forgot-link:hover{color:var(--teal)}
.legal{font-size:.64rem;color:rgba(74,102,96,.7);text-align:center;line-height:1.5;max-width:340px}
.legal a{color:var(--muted);text-decoration:underline}
.signup-only{display:none}
.signup-only.show{display:flex}
.signin-only{display:flex}
.signin-only.hide{display:none}
/* message box */
.msg-box{width:100%;padding:11px 14px;border-radius:10px;font-size:.82rem;text-align:center;display:none}
.msg-box.show{display:block}
.msg-box.error{background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.3);color:#ff6b78}
.msg-box.success{background:rgba(46,196,182,.12);border:1px solid var(--border2);color:var(--teal)}
</style>
</head>
<body>
<div class="glow"></div>

<div class="auth-wrap">
  <div class="logo">
    <div class="logo-badge">
      <svg width="38" height="38" viewBox="0 0 40 40" fill="none">
        <rect x="6" y="27" width="7" height="8" rx="1.5" fill="#000" opacity="0.35"/>
        <rect x="15" y="19" width="7" height="16" rx="1.5" fill="#000" opacity="0.6"/>
        <rect x="24" y="9" width="7" height="26" rx="1.5" fill="#000" opacity="0.85"/>
      </svg>
    </div>
    <div class="logo-name">win<span>step</span></div>
    <div class="logo-tagline">Earn · Play · Win</div>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" id="tabSignin" onclick="switchTab('signin')">Sign In</button>
      <button class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="msg-box" id="msgBox"></div>

    <div class="input-group signup-only" id="usernameGroup">
      <label class="input-label">Username</label>
      <input type="text" class="input-field" placeholder="Choose a username" id="usernameInput">
      <span class="input-hint">This will appear on the leaderboard</span>
    </div>

    <div class="input-group">
      <label class="input-label">Email</label>
      <input type="email" class="input-field" placeholder="you@example.com" id="emailInput">
    </div>

    <div class="input-group">
      <label class="input-label">Password</label>
      <input type="password" class="input-field" placeholder="••••••••" id="passwordInput">
    </div>

    <div class="input-group signup-only" id="confirmGroup">
      <label class="input-label">Confirm Password</label>
      <input type="password" class="input-field" placeholder="••••••••" id="confirmInput">
    </div>

    <div class="forgot-row signin-only" id="forgotRow">
      <a class="forgot-link" onclick="forgotPassword()">Forgot password?</a>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">Sign In</button>

    <div class="auth-note" id="authNote">
      Don't have an account? <a onclick="switchTab('signup')">Sign up free</a>
    </div>
  </div>

  <div class="legal signup-only" id="legalNote">
    By signing up you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    No purchase necessary to participate.
  </div>
</div>

<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================
//  ⚠️ ჩასვი შენი მონაცემები აქ:
// ============================================
const SUPABASE_URL = 'https://eybpnmplndedpnhuasyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_X4EkeI2UOnaZQ28A7d8Ckw_q1sM5yQY';
// ============================================

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mode = 'signin';

function switchTab(m){
  mode = m;
  document.getElementById('tabSignin').classList.toggle('active', m==='signin');
  document.getElementById('tabSignup').classList.toggle('active', m==='signup');
  document.querySelectorAll('.signup-only').forEach(el=>el.classList.toggle('show', m==='signup'));
  document.querySelectorAll('.signin-only').forEach(el=>el.classList.toggle('hide', m!=='signin'));
  document.getElementById('submitBtn').textContent = m==='signin' ? 'Sign In' : 'Create Account';
  document.getElementById('authNote').innerHTML = m==='signin'
    ? "Don't have an account? <a onclick=\"switchTab('signup')\">Sign up free</a>"
    : "Already have an account? <a onclick=\"switchTab('signin')\">Sign in</a>";
  hideMsg();
}

function showMsg(text, type){
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'msg-box show ' + type;
}
function hideMsg(){ document.getElementById('msgBox').className = 'msg-box'; }

async function handleSubmit(){
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const btn = document.getElementById('submitBtn');

  if(!email || !password){ showMsg('Please fill in all fields.', 'error'); return; }

  btn.disabled = true;

  if(mode === 'signup'){
    const username = document.getElementById('usernameInput').value.trim();
    const confirm = document.getElementById('confirmInput').value;

    if(!username || username.length < 3){ showMsg('Username must be at least 3 characters.', 'error'); btn.disabled=false; return; }
    if(password !== confirm){ showMsg('Passwords do not match.', 'error'); btn.disabled=false; return; }

    btn.textContent = 'Creating account...';
    const { data, error } = await db.auth.signUp({
      email, password,
      options: { data: { username: username } }
    });

    if(error){ showMsg(error.message, 'error'); btn.disabled=false; btn.textContent='Create Account'; return; }
    showMsg('Account created! You can now sign in. 🎉', 'success');
    btn.disabled=false; btn.textContent='Create Account';
    setTimeout(()=>switchTab('signin'), 1500);

  } else {
    btn.textContent = 'Signing in...';
    const { data, error } = await db.auth.signInWithPassword({ email, password });

    if(error){ showMsg(error.message, 'error'); btn.disabled=false; btn.textContent='Sign In'; return; }
    showMsg('Welcome back! Redirecting... ✅', 'success');
    // redirect to main page after login:
    setTimeout(()=>{ window.location.href = '/dashboard.html'; }, 1200);
  }
}

async function forgotPassword(){
  const email = document.getElementById('emailInput').value.trim();
  if(!email){ showMsg('Enter your email first, then tap "Forgot password".', 'error'); return; }
  const { error } = await db.auth.resetPasswordForEmail(email);
  if(error){ showMsg(error.message, 'error'); return; }
  showMsg('Password reset link sent to your email. 📧', 'success');
}

// check if already logged in
(async ()=>{
  const { data } = await db.auth.getSession();
  if(data.session){
    window.location.href = '/dashboard.html';
  }
})();
</script>
</body>
</html>
