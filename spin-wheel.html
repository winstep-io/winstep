<style>
:root{
  --bg:#080c0b; --bg2:#0d1412; --bg3:#111a18; --bg4:#162220;
  --teal:#2ec4b6; --teal2:#1a9e90; --teal3:rgba(46,196,182,.12); --teal4:rgba(46,196,182,.06);
  --gold:#f5c842; --green:#2ec47a; --red:#e63946;
  --text:#e8f0ee; --muted:#4a6660; --soft:#9fb5b0;
  --border:rgba(46,196,182,.1); --border2:rgba(46,196,182,.2);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(120% 90% at 50% -10%, #0f1a18 0%, var(--bg) 55%);
  color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;
  display:flex;flex-direction:column;
}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--bg2)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-badge{width:36px;height:36px;background:var(--teal);border-radius:9px;display:flex;align-items:center;justify-content:center}
.logo-name{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.1rem}
.logo-name span{color:var(--teal)}
.h-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--soft);font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;padding:8px 14px;border-radius:8px;text-decoration:none;transition:all .2s}
.h-btn:hover{border-color:var(--teal);color:var(--teal)}

.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px 40px;gap:6px}
.eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);font-weight:600}
.title{font-family:'Fredoka',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-.01em}
.subtitle{font-size:.92rem;color:var(--muted);margin-bottom:18px;text-align:center}

.wheel-stage{position:relative;width:340px;max-width:88vw;aspect-ratio:1;margin-bottom:8px}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;
  width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
  border-top:26px solid var(--gold);filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.pointer::after{content:'';position:absolute;top:-30px;left:-6px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(245,200,66,.6)}

.wheel-ring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#1a3330,#0d1412);
  padding:10px;box-shadow:0 0 0 4px var(--bg3),0 0 0 6px var(--border2),0 18px 50px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.6)}
#wheel{width:100%;height:100%;display:block;border-radius:50%;
  transform:rotate(0deg);transition:transform 5s cubic-bezier(.16,.84,.20,1)}
.wheel-ring.spinning{box-shadow:0 0 0 4px var(--bg3),0 0 0 6px var(--teal),0 0 40px var(--teal3),0 18px 50px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.6)}

.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
  width:58px;height:58px;border-radius:50%;background:var(--bg3);
  border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.5)}
.hub svg{width:30px;height:30px}

.result{min-height:56px;display:flex;align-items:center;justify-content:center;margin:6px 0 14px}
.result-card{opacity:0;transform:translateY(8px);transition:all .4s;text-align:center}
.result-card.show{opacity:1;transform:translateY(0)}
.result-num{font-family:'Fredoka',sans-serif;font-size:2.4rem;font-weight:700;line-height:1;color:var(--gold)}
.result-num.zero{color:var(--muted)}
.result-label{font-size:.86rem;color:var(--soft);margin-top:4px}
.result-label b{color:var(--green)}

.spin-btn{padding:15px 48px;border:none;border-radius:12px;font-family:'Fredoka',sans-serif;
  font-size:1.05rem;font-weight:700;letter-spacing:.04em;cursor:pointer;
  background:var(--teal);color:#04100e;transition:all .2s;
  box-shadow:0 6px 20px rgba(46,196,182,.28)}
.spin-btn:hover:not(:disabled){background:#44ffe8;transform:translateY(-2px);box-shadow:0 10px 28px rgba(46,196,182,.4)}
.spin-btn:active:not(:disabled){transform:translateY(0)}
.spin-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

.hint{font-size:.76rem;color:var(--muted);margin-top:14px;text-align:center;max-width:320px}
.back-link{margin-top:22px}

@media (prefers-reduced-motion: reduce){ #wheel{transition:transform 1.2s ease-out} }
@media (max-width:480px){ .title{font-size:1.6rem} }
</style>
  <!-- cookie-consent (inlined: removes a render-blocking request; must still
       run BEFORE the GA4 block below so Consent Mode v2 defaults apply first) -->
  <script>
(function () {
  'use strict';

  var KEY = 'winstep_cookie_consent'; // 'accepted' | 'rejected'

  // ---- Google Consent Mode v2 plumbing (ready for GA / AdSense) ----
  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = window.gtag || gtag;

  var stored = null;
  try { stored = localStorage.getItem(KEY); } catch (e) {}

  // Default = everything denied (must run before GA/AdSense load).
  // With ad_storage denied, AdSense auto-serves NON-personalized ads (variant B).
  window.gtag('consent', 'default', {
    analytics_storage: 'denied',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    wait_for_update: 500
  });

  function applyConsent(state) {
    var granted = (state === 'accepted');
    window.gtag('consent', 'update', {
      analytics_storage: granted ? 'granted' : 'denied',
      ad_storage:        granted ? 'granted' : 'denied',
      ad_user_data:      granted ? 'granted' : 'denied',
      ad_personalization:granted ? 'granted' : 'denied'
    });
    // Simple flag any ad-loading code can read: true = personalized, false = contextual
    window.winstepAds = { personalized: granted };
  }

  // Re-apply a previously saved choice on every page load (no banner re-show)
  if (stored === 'accepted' || stored === 'rejected') {
    applyConsent(stored);
  } else {
    window.winstepAds = { personalized: false }; // safe default until they choose
  }

  // ---- Banner UI ----
  function buildBanner() {
    if (document.getElementById('ws-cookie-banner')) return;
    var b = document.createElement('div');
    b.id = 'ws-cookie-banner';
    b.setAttribute('role', 'dialog');
    b.setAttribute('aria-label', 'Cookie consent');
    b.style.cssText =
      'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
      'background:#0e1614;border-top:1px solid rgba(46,196,182,.25);' +
      'box-shadow:0 -8px 30px rgba(0,0,0,.45);padding:16px 20px;' +
      "font-family:Nunito,'Segoe UI',sans-serif;color:#c9d4d1";
    b.innerHTML =
      '<div style="max-width:1000px;margin:0 auto;display:flex;align-items:center;' +
      'gap:18px;flex-wrap:wrap;justify-content:center">' +
        '<div style="flex:1;min-width:240px;font-size:.92rem;line-height:1.5">' +
          '\uD83C\uDF6A Winstep is completely free for everyone, and ads are our only source of income. ' +
          'Accepting cookies helps us keep it that way \u2014 but the choice is yours. Thank you for understanding! ' +
          '<a href="/privacy.html" target="_blank" rel="noopener" ' +
          'style="color:#2ec4b6;text-decoration:underline">Privacy Policy</a>' +
        '</div>' +
        '<div style="display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:center">' +
          '<button id="ws-cookie-reject" type="button" ' +
          'style="padding:11px 22px;background:transparent;border:1.5px solid rgba(159,181,176,.55);' +
          "color:#c9d4d1;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer\">" +
          'Reject All</button>' +
          '<button id="ws-cookie-accept" type="button" ' +
          'style="padding:11px 26px;background:#2ec4b6;border:1.5px solid #2ec4b6;' +
          "color:#0a1413;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer\">" +
          'Accept All</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(b);
    document.getElementById('ws-cookie-accept').onclick = function () { choose('accepted'); };
    document.getElementById('ws-cookie-reject').onclick = function () { choose('rejected'); };
  }

  function removeBanner() {
    var el = document.getElementById('ws-cookie-banner');
    if (el) el.remove();
  }

  function choose(state) {
    try { localStorage.setItem(KEY, state); } catch (e) {}
    applyConsent(state);
    removeBanner();
    // let other on-page scripts know the cookie question is now resolved
    try { window.dispatchEvent(new CustomEvent('winstep:consent', { detail: { state: state } })); } catch (e) {}
  }

  function showBannerIfNeeded() {
    if (stored !== 'accepted' && stored !== 'rejected') buildBanner();
  }

  // ---- Public API (for the "Cookie Settings" footer link) ----
  window.winstepConsent = {
    get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    open: function () { buildBanner(); }  // re-open to change choice anytime
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', showBannerIfNeeded);
  } else {
    showBannerIfNeeded();
  }
})();

<style>
/* ============================================================
   winstep — "crate" skin, shared override layer
   Appended AFTER each page's own stylesheet, so it only reshapes
   what it names. Anything not covered keeps its original rule
   (in the new colours, because the tokens below are overridden).
   ============================================================ */
:root{
  --bg:#0a0f0e; --bg2:#111a18; --bg3:#182421; --bg4:#20302c;
  --teal:#2ec4b6; --teal2:#6fd8cc;
  --teal-btn:#2ec4b6; --teal-lip:#15756c; --teal-hi:#48ded0;
  --teal3:rgba(46,196,182,.15); --teal4:rgba(46,196,182,.07);
  --gold:#f5c842; --gold2:rgba(245,200,66,.13); --gold-lip:#a8831c;
  --green:#3ddc84; --green2:rgba(61,220,132,.16);
  --silver:#c9d2d0; --bronze:#d69a5c;
  --red:#ff6b78; --red2:rgba(255,107,120,.16);
  --on-accent:#04100e;
  --text:#e8f0ee; --text2:#c9d4d1; --muted:#7e9a94; --soft:#9fb5b0;
  --paper:#f6ecd9; --paper-ink:#241a08;
  --border:rgba(255,255,255,.06); --border2:rgba(46,196,182,.34);
  --lift:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 18px -14px rgba(0,0,0,.75);
  --disp:'Fredoka',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
}

/* ── ground ─────────────────────────────────────────────── */
body{background:var(--bg);font-family:var(--body)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 900px 460px at 50% -12%,rgba(46,196,182,.18),transparent 66%),
    radial-gradient(ellipse 700px 420px at 88% 30%,rgba(245,200,66,.05),transparent 62%)}

/* ── header + logo ──────────────────────────────────────── */
header,.topbar,.app-top{background:rgba(10,15,14,.9)!important;border-bottom:1px solid var(--border)!important}
.logo-badge{border-radius:13px!important;
  box-shadow:0 4px 12px -7px rgba(46,196,182,.55),inset 0 1px 0 rgba(255,255,255,.28)!important}
.logo-name{font-family:var(--disp)!important;font-weight:700!important;letter-spacing:-.01em!important}

/* ── chunky plastic keys (pressable, with a lip) ────────── */
.back-btn,.back-link,.back,.logout-btn,.logout-btn2,.acc-btn,.next-btn,.continue-btn,
.btn,.btn-lg,.btn-solid,.btn-ghost,.btn-hero,.submit-btn,.verify-btn,
.guess-btn,.h-btn,.over-btn,.spin-btn,.task-b,.bridge-b,.verify-resend,.btns .btn{
  font-family:var(--disp)!important;font-weight:600!important;letter-spacing:0!important;
  border-radius:13px!important;transition:transform .08s,box-shadow .08s,background .15s!important}
.back-btn,.back-link,.back,.logout-btn,.logout-btn2,.acc-btn,.btn-ghost,.h-btn{
  background:var(--bg3)!important;border:0!important;color:var(--text2)!important;
  box-shadow:0 2px 0 rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05)!important}
.back-btn:hover,.back-link:hover,.back:hover,.logout-btn:hover,.logout-btn2:hover,
.acc-btn:hover,.btn-ghost:hover,.h-btn:hover{background:var(--bg4)!important;color:var(--text)!important}
.btn,.btn-lg,.btn-solid,.btn-hero,.submit-btn,.next-btn,.continue-btn,.verify-btn,
.guess-btn,.over-btn,.spin-btn,.task-b,.bridge-b{
  background:var(--teal-btn)!important;border:0!important;color:var(--on-accent)!important;
  box-shadow:0 2px 0 var(--teal-lip),0 5px 12px -9px rgba(46,196,182,.45)!important}
.btn:hover,.btn-lg:hover,.btn-solid:hover,.btn-hero:hover,.submit-btn:hover,
.next-btn:hover,.continue-btn:hover,.guess-btn:hover,.spin-btn:hover{
  background:var(--teal-hi)!important}
.back-btn:active,.back-link:active,.back:active,.logout-btn:active,.logout-btn2:active,
.acc-btn:active,.btn:active,.btn-lg:active,.btn-solid:active,.btn-hero:active,
.submit-btn:active,.next-btn:active,.continue-btn:active,.guess-btn:active,
.h-btn:active,.over-btn:active,.spin-btn:active{transform:translateY(2px)!important;
  box-shadow:0 0 0 currentColor!important}
/* .google-btn is intentionally NOT restyled here — see crate-index.css */

/* ── surfaces ───────────────────────────────────────────── */
.card,.stat-card,.standing-card,.auth-card,.quiz-card,.result-card,.over-card,
.modal-card,.boxc,.c,.frame,.callout,.current-box,.score-box,.hud,.scoreboard,
.msg-box,.settings-row,.history-row,.verify-card,.task,.champ,.faq{
  border:0!important;box-shadow:var(--lift)!important}
.card,.auth-card,.quiz-card,.result-card,.over-card,.modal-card,.boxc,.c,.frame,
.verify-card,.champ,.faq{border-radius:24px!important}
.stat-card,.standing-card,.callout,.current-box,.score-box,.hud,.scoreboard,
.msg-box,.settings-row,.history-row,.task{border-radius:18px!important}
.card,.stat-card,.standing-card,.auth-card,.quiz-card,.over-card,.modal-card,
.boxc,.verify-card{background:var(--bg2)!important}

/* ── form fields ────────────────────────────────────────── */
.input-field,.acc-input,input[type=text],input[type=email],input[type=password]{
  background:var(--bg3)!important;border:0!important;border-radius:14px!important;
  font-family:var(--body)!important;font-weight:600!important;color:var(--text)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)!important}
.input-field:focus,.acc-input:focus,input:focus{outline:0!important;
  box-shadow:0 0 0 2px var(--teal)!important}
.input-label,.field-label,.s-label,.sp-label,.stat-lbl,.sr-label,.timer-label{
  font-family:var(--body)!important;font-weight:700!important;color:var(--muted)!important}

/* ── headings + section titles ──────────────────────────── */
.section-title,.sec-h,.title,.hud-title,.modal-title,.q-text,.result-title,
.over-title,.next-title,.rh-title,.profile-name,.quiz-tag,.hero{
  font-family:var(--disp)!important;letter-spacing:-.015em!important}
.section-title{font-size:1.2rem!important;letter-spacing:-.01em!important;
  text-transform:none!important;color:var(--text)!important;font-weight:600!important}
.section-title::after{content:none!important}

/* ── pills, badges, tags ────────────────────────────────── */
.profile-rank-pill,.rh-tag,.quiz-tag,.rs-live-badge,.pts,.champ-badge{
  border:0!important;border-radius:999px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)!important}

/* ── numbers that used to be Bebas (condensed) ──────────── */
/* Fredoka is wider, so the sizes tuned for Bebas are stepped down */
.stat-val{font-family:var(--disp)!important;font-weight:700!important;font-size:1.75rem!important;
  letter-spacing:-.02em!important}
.standing-rank{font-family:var(--disp)!important;font-weight:700!important;font-size:2rem!important}
.profile-avatar{font-family:var(--disp)!important;font-weight:700!important;font-size:1.9rem!important;
  color:var(--on-accent)!important;
  background:linear-gradient(150deg,var(--teal-hi),var(--teal))!important;
  box-shadow:0 6px 18px -10px rgba(46,196,182,.6)!important}
.rh-title{font-family:var(--disp)!important;font-weight:700!important;font-size:2.1rem!important;
  letter-spacing:-.025em!important}
.podium-avatar{font-family:var(--disp)!important;font-weight:700!important;color:var(--on-accent)!important}
.p1 .podium-avatar{font-size:1.9rem!important}
.p2 .podium-avatar,.p3 .podium-avatar{font-size:1.5rem!important}
.podium-pts{font-family:var(--disp)!important;font-weight:700!important;font-size:1rem!important}
.podium-bar{font-family:var(--disp)!important;font-weight:700!important;font-size:1.1rem!important;
  border-radius:14px 14px 0 0!important}
.podium-name,.podium-prize,.lb-pts,.lb-rank,.s-pts,.sp-val,.rs-round,.rs-pts,
.history-pts,.result-pts,.q-pts,.over-score,.result-num,.st-val,.tt-val,.timer-value{
  font-family:var(--disp)!important;font-weight:700!important}
.lb-avatar,.lb-avatar-initial{font-family:var(--disp)!important;font-weight:700!important}
.lb-avatar-initial{background:linear-gradient(150deg,var(--teal-hi),var(--teal))!important;
  color:var(--on-accent)!important}
.next-title{font-family:var(--disp)!important;font-weight:600!important;font-size:1.3rem!important;
  letter-spacing:-.02em!important}

/* ── tables + rows ──────────────────────────────────────── */
.rs-table th{font-family:var(--body)!important;font-weight:700!important;
  font-size:.7rem!important;color:var(--muted)!important;border-bottom:1px solid var(--border)!important}
.rs-table td{font-size:.92rem!important;font-weight:600!important;border-bottom:1px solid var(--border)!important}
.lb-row,.history-row,.settings-row{border-bottom:0!important;border-radius:16px!important}
.lb-row.me{background:rgba(46,196,182,.13)!important}

/* ── footers ────────────────────────────────────────────── */
.ws-mini-foot,.footer,.foot-links,.legal,.foot-disclaimer{border-top:0!important;
  font-family:var(--body)!important;font-weight:600!important;color:var(--muted)!important}
.ws-mini-foot a,.ws-mini-foot button.ws-link,.footer a,.foot-links a{
  color:var(--muted)!important;padding:6px 2px!important;display:inline-block!important}
.ws-mini-foot a:hover,.footer a:hover,.foot-links a:hover{color:var(--teal)!important}

/* ── small fixes found by measuring, not by eye ─────────── */
/* results.html: the decorative hero glow is a fixed 400px pseudo-element and
   pushed 5px past the viewport on a 390px phone (pre-existing, fixed here) */
.results-hero::after{width:min(400px,100%)!important}
/* nothing below 11px — these three were 10.2–10.9px */
.rh-tag{font-size:.74rem!important}
.prize-note .disclaimer,.prize-note a{font-size:.78rem!important}
.sr-desc,.acc-note,div[style*="font-size:.68rem"],
div[style*="font-size:.66rem"]{font-size:.78rem!important}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── games: page-specific ────────────────────────────────── */

/* quiz — answers keep their green/red semantics, only the shape changes */
.answer{border:0!important;border-radius:16px!important;background:var(--bg3)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)!important;
  font-family:var(--body)!important;font-weight:600!important}
.answer:hover:not(.disabled){background:var(--bg4)!important;transform:translateX(3px)!important}
.answer-letter{border:0!important;border-radius:11px!important;font-family:var(--disp)!important;
  font-weight:700!important;background:var(--teal3)!important;color:var(--teal)!important}
.answer-text{font-weight:600!important;font-size:1rem!important}
.answer.correct{background:var(--green2)!important;
  box-shadow:0 0 0 1.5px var(--green),inset 0 1px 0 rgba(255,255,255,.06)!important}
.answer.correct .answer-letter{background:var(--green)!important;color:#04140a!important}
.answer.correct .answer-text{color:var(--green)!important}
.answer.wrong{background:var(--red2)!important;
  box-shadow:0 0 0 1.5px var(--red),inset 0 1px 0 rgba(255,255,255,.06)!important}
.answer.wrong .answer-letter{background:var(--red)!important;color:#2a0508!important}
.answer.wrong .answer-text{color:var(--red)!important}
.timer-section{border-bottom:0!important;background:transparent!important}
.timer-track,.st-track,.tt-track{border-radius:99px!important;background:rgba(255,255,255,.07)!important}
.timer-fill,.st-fill,.tt-fill{border-radius:99px!important}
.q-text{font-size:1.3rem!important;font-weight:600!important;line-height:1.3!important}
.quiz-tag{background:var(--teal3)!important;color:var(--teal)!important;
  font-family:var(--body)!important;font-weight:700!important;font-size:.7rem!important}

/* hilo — the playing card must stay a real white card, untouched by the
   card/shadow rules above; only its corner type is restyled */
.playing-card{border-radius:20px!important;background:#f6f4ef!important;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.75)!important;
  /* the card ships without .red/.black until JS deals — without this the
     placeholder pips inherit the light page text colour on a white card */
  color:var(--card-black,#1a2422)!important}
.pc-corner,.pc-rank,.pc-center{font-family:var(--disp)!important;font-weight:700!important}
.guess-btn.low{background:var(--bg3)!important;color:var(--text)!important;
  box-shadow:0 2px 0 rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05)!important}
.guess-btn.low:hover:not(:disabled){background:var(--bg4)!important;color:var(--text)!important}
.guess-btn:disabled{opacity:.35!important;box-shadow:none!important;transform:none!important}
.score-box .k{font-family:var(--body)!important;font-weight:700!important;
  font-size:.7rem!important;color:var(--muted)!important}
.score-box .v{font-family:var(--disp)!important;font-weight:700!important;font-size:1.5rem!important}
.eyebrow{font-family:var(--body)!important;font-weight:700!important;color:var(--teal)!important;
  font-size:.74rem!important}
.title{font-size:1.9rem!important;font-weight:600!important}
.subtitle{font-size:.95rem!important;color:var(--muted)!important;font-weight:600!important}
.feedback{font-family:var(--disp)!important;font-weight:600!important;font-size:1rem!important}
.over-card{border-radius:24px!important}
.over-title{font-family:var(--disp)!important;font-weight:600!important}
.over-score{font-size:2rem!important}

/* spin wheel — the wheel itself is canvas/SVG, only its frame is restyled */
.wheel-ring{box-shadow:0 0 0 4px var(--bg3),0 0 0 6px rgba(46,196,182,.3),
  0 12px 34px -14px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.55)!important}
.wheel-ring.spinning{box-shadow:0 0 0 4px var(--bg3),0 0 0 6px var(--teal),
  0 0 30px var(--teal3),0 12px 34px -14px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.55)!important}
.hub{border:0!important;background:var(--bg3)!important;
  box-shadow:0 3px 10px -4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07)!important}
.result-num{font-family:var(--disp)!important;font-weight:700!important;font-size:2.1rem!important}
.result-label{font-weight:600!important;color:var(--soft)!important}

/* bridge — HUD, pips and the two pick buttons */
.demo-note{font-size:.78rem!important;font-weight:600!important}
.hud{background:var(--bg2)!important}
.hud-title{font-family:var(--disp)!important;font-weight:700!important;
  font-size:1.15rem!important;letter-spacing:0!important}
.hs .l{font-family:var(--body)!important;font-weight:700!important;font-size:.74rem!important;
  color:var(--muted)!important}
.hs .v{font-family:var(--disp)!important;font-weight:700!important;font-size:1.05rem!important;
  letter-spacing:0!important}
#cw{border:0!important;border-radius:20px!important;
  box-shadow:0 8px 22px -14px rgba(0,0,0,.8)!important}
.pip{border-radius:99px!important;background:rgba(255,255,255,.08)!important}
.pip.done{background:var(--teal)!important}
.pip.cur{background:rgba(46,196,182,.5)!important}
.step-timer{background:var(--bg2)!important;border:0!important;border-radius:18px!important;
  box-shadow:var(--lift)!important}
.st-label{font-family:var(--body)!important;font-weight:700!important;font-size:.7rem!important}
.btns .btn{font-size:.95rem!important;letter-spacing:0!important;padding:15px!important}
.btns .btn:disabled{opacity:.35!important;box-shadow:none!important;transform:none!important}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="window.location.href='/dashboard.html'">
    <div class="logo-badge">
      <svg width="22" height="22" viewBox="0 0 40 40" fill="none">
        <rect x="6" y="27" width="7" height="8" rx="1.5" fill="#000" opacity="0.35"/>
        <rect x="15" y="19" width="7" height="16" rx="1.5" fill="#000" opacity="0.6"/>
        <rect x="24" y="9" width="7" height="26" rx="1.5" fill="#000" opacity="0.85"/>
      </svg>
    </div>
    <div class="logo-name">win<span>step</span></div>
  </div>
  <a class="h-btn" href="/dashboard.html">← Back to Dashboard</a>
</header>

<div class="wrap" id="wrap">
  <div class="eyebrow">Bonus Game</div>
  <div class="title">Spin Wheel</div>
  <div class="subtitle">Spin the wheel — whatever number it lands on, that's your points.</div>

  <div class="wheel-stage">
    <div class="pointer"></div>
    <div class="wheel-ring" id="wheelRing">
      <svg id="wheel" viewBox="0 0 300 300"></svg>
    </div>
    <div class="hub">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="6" y="27" width="7" height="8" rx="1.5" fill="#2ec4b6" opacity="0.4"/>
        <rect x="15" y="19" width="7" height="16" rx="1.5" fill="#2ec4b6" opacity="0.7"/>
        <rect x="24" y="9" width="7" height="26" rx="1.5" fill="#2ec4b6"/>
      </svg>
    </div>
  </div>

  <div class="result">
    <div class="result-card" id="resultCard">
      <div class="result-num" id="resultNum">0</div>
      <div class="result-label" id="resultLabel"></div>
    </div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>
  <div class="hint">One spin only. Higher is better!</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://eybpnmplndedpnhuasyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_X4EkeI2UOnaZQ28A7d8Ckw_q1sM5yQY';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let spinUser = null;
let myProgressId = null;
let spinSaved = false;
let currentSession = null;   // ავტ. ტოკენი pagehide-ის sync XHR-ისთვის
let gameActive = false;      // გვერდი გაიხსნა და მცდელობა ცოცხალია
let gameEnded  = false;      // დატრიალდა ან დაიბლოკა
let forfeited  = false;      // forfeit უკვე გაიგზავნა

// wheel config (set from admin settings)
let START = 0, STEP = 1;
const N = 21;                 // 21 segments (fixed)
const SEG = 360 / N;
const CX = 150, CY = 150, R = 150;
// roulette-style index arrangement (which segment slot shows which position 0..20)
const SLOT_ORDER = [0,13,7,17,2,11,20,5,14,9,18,1,12,8,16,4,19,6,15,10,3];

// value at a given slot = START + position*STEP
function valueAt(positionIndex){ return START + positionIndex * STEP; }

function segColor(positionIndex, i){
  if(positionIndex === 0)  return '#23302d';   // lowest
  if(positionIndex === 20) return '#7a5e1c';   // highest = gold
  return (i % 2 === 0) ? '#163f3a' : '#1d655c';
}
function pt(angleDeg, radius){
  const a = (angleDeg * Math.PI) / 180;
  return [CX + radius * Math.sin(a), CY - radius * Math.cos(a)];
}

function buildWheel(){
  const svg = document.getElementById('wheel');
  let s = '';
  for(let i=0; i<N; i++){
    const positionIndex = SLOT_ORDER[i];     // 0..20
    const value = valueAt(positionIndex);
    const a0 = i * SEG, a1 = (i + 1) * SEG;
    const [x0,y0] = pt(a0, R);
    const [x1,y1] = pt(a1, R);
    s += `<path d="M${CX} ${CY} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${segColor(positionIndex,i)}" stroke="#0a1110" stroke-width="1"/>`;
    const mid = a0 + SEG/2;
    const [lx,ly] = pt(mid, R * 0.74);
    const isSpecial = (positionIndex === 0 || positionIndex === 20);
    const fill = positionIndex === 0 ? '#6c8580' : (positionIndex === 20 ? '#ffe08a' : '#e8f0ee');
    s += `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" fill="${fill}" font-family="'Fredoka',sans-serif" font-size="${isSpecial?15:13}" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="rotate(${mid.toFixed(2)} ${lx.toFixed(2)} ${ly.toFixed(2)})">${value}</text>`;
  }
  svg.innerHTML = s;
}

let spinning = false;
let totalRotation = 0;
let hasSpun = false;

async function spin(){
  if(spinning || hasSpun) return;
  spinning = true;
  hasSpun = true;

  const btn = document.getElementById('spinBtn');
  const ring = document.getElementById('wheelRing');
  const card = document.getElementById('resultCard');
  btn.disabled = true;
  btn.textContent = 'SPINNING…';
  card.classList.remove('show');
  ring.classList.add('spinning');

  // გზა B — შედეგს სერვერი ირჩევს და წერს ქულას
  const { data: res } = await db.rpc('spin_play');
  if(!res || !res.ok){
    ring.classList.remove('spinning');
    blockGame();
    return;
  }
  gameEnded = true;          // დატრიალდა — მცდელობა გაიხარჯა (spin_played=true სერვერზე)
  const positionIndex = res.position;          // 0..20 (სერვერიდან)
  const targetValue = res.value;               // ქულა (სერვერიდან)
  const targetSlot = SLOT_ORDER.indexOf(positionIndex);

  const centerAngle = targetSlot * SEG + SEG/2;
  const landing = (360 - (centerAngle % 360)) % 360;
  const current = totalRotation % 360;
  const spins = 5 + Math.floor(Math.random() * 3);
  const delta = (spins * 360) + ((landing - current + 360) % 360);
  totalRotation += delta;

  document.getElementById('wheel').style.transform = `rotate(${totalRotation}deg)`;

  const onEnd = async () => {
    document.getElementById('wheel').removeEventListener('transitionend', onEnd);
    ring.classList.remove('spinning');
    // ბორბალი გაჩერდა — ახლა ირიცხება ქულა (გზა B: სერვერი). ტრიალის შუა
    // გამოსვლისას ეს არ გამოიძახება → ქულა 0.
    try { await db.rpc('spin_confirm'); } catch(e){}
    showResult(targetValue);
    btn.textContent = 'Done';
    spinning = false;
  };
  document.getElementById('wheel').addEventListener('transitionend', onEnd);
}

function showResult(value){
  const num = document.getElementById('resultNum');
  const label = document.getElementById('resultLabel');
  const card = document.getElementById('resultCard');
  num.textContent = value;
  num.className = 'result-num' + (value === 0 ? ' zero' : '');
  if(value === 0){
    label.innerHTML = 'No points this time!';
  } else {
    label.innerHTML = `You won <b>+${value} points</b>!`;
  }
  card.classList.add('show');
  // after a moment, offer back to dashboard
  setTimeout(()=>{
    document.getElementById('spinBtn').textContent = '← Back to Dashboard';
    document.getElementById('spinBtn').disabled = false;
    document.getElementById('spinBtn').onclick = ()=>{ window.location.href='/dashboard.html'; };
  }, 1500);
}

// გზა B: ქულის დარიცხვა და spin_played ახლა სერვერზე ხდება (spin_play).

// ---- გამოსვლა დატრიალებამდე = მიტოვება (Back / Back to Dashboard / დახურვა) ----
// მცდელობა იხარჯება ქულის გარეშე (0): დაშბორდზე აღარ ჩანს, ხელახლა ვერ შევა.
function forfeitGame(){
  if(!gameActive || gameEnded || forfeited) return;
  forfeited = true;
  try{
    const token = (currentSession && currentSession.access_token) || SUPABASE_KEY;
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/rest/v1/rpc/spin_forfeit', false); // sync
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.send('{}');
  }catch(e){}
}
window.addEventListener('pagehide', forfeitGame);

function blockGame(){
  gameEnded = true;          // თამაში არ ცოცხალია — forfeit არ გავუშვათ
  document.getElementById('wrap').innerHTML = '<div style="text-align:center;padding:50px 20px;color:var(--muted)"><div style="font-size:2.4rem;margin-bottom:14px">🎡</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;color:var(--text);margin-bottom:8px">Spin Wheel not available</div><div style="font-size:.85rem;max-width:320px;margin:0 auto;line-height:1.5">This game unlocks during the break after a box — but only if you answered enough quiz questions correctly. Keep playing to earn your next attempt!</div><button onclick="window.location.href=\'/dashboard.html\'" style="margin-top:20px;padding:11px 22px;background:var(--bg3);border:1px solid var(--border2);color:var(--teal);border-radius:9px;font-family:Nunito,sans-serif;font-weight:600;cursor:pointer">← Back to Dashboard</button></div>';
}

async function init(){
  // settings
  const { data: setRows } = await db.from('settings').select('*').in('key',['spinwheel_start','spinwheel_step']);
  if(setRows){ for(const r of setRows){ if(r.key==='spinwheel_start') START=r.value; if(r.key==='spinwheel_step') STEP=r.value; } }
  buildWheel();

  // auth
  const { data: { session } } = await db.auth.getSession();
  if(!session){ window.location.href = '/index.html'; return; }
  spinUser = session.user;
  currentSession = session;

  // eligibility: spin game unlocked, not played, interval running
  const today = new Date().toISOString().split('T')[0];
  const { data: prog } = await db.from('user_box_progress')
    .select('*')
    .eq('user_id', spinUser.id)
    .eq('day', today)
    .eq('game_type', 'spin')
    .eq('bridge_unlocked', true)
    .eq('spin_played', false);

  const live = (prog||[]).find(p => p.interval_ends_at && new Date(p.interval_ends_at) > new Date());
  if(!live){ blockGame(); return; }
  myProgressId = live.id;
  gameActive = true;         // აქედან გამოსვლა დატრიალებამდე = მიტოვება
}

init();
</script>
</body>
</html>
