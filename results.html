<style>
:root{
  --bg:#080c0b; --bg2:#0d1412; --bg3:#111a18; --bg4:#162220;
  --teal:#2ec4b6; --teal2:#1a9e90; --teal3:rgba(46,196,182,.12); --teal4:rgba(46,196,182,.06);
  --gold:#f5c842; --gold2:rgba(245,200,66,.15);
  --silver:#c0c0c8; --bronze:#cd7f32;
  --green:#2ec47a;
  --text:#e8f0ee; --muted:#4a6660; --soft:#9fb5b0;
  --border:rgba(46,196,182,.1); --border2:rgba(46,196,182,.2);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:rgba(8,12,11,.95);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo-badge{width:42px;height:42px;background:var(--teal);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 22px rgba(46,196,182,.3)}
.logo-name{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;line-height:1}
.logo-name,.logo-name *{color:var(--text)}
.logo-name span{color:var(--teal)}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);color:var(--soft);font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;letter-spacing:.05em;padding:9px 16px;border-radius:8px;transition:all .2s;text-decoration:none}
.back-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal4)}

.wrap{max-width:760px;margin:0 auto;padding:32px 24px 60px}

/* HERO */
.results-hero{text-align:center;margin-bottom:36px;position:relative}
.results-hero::after{content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:400px;height:300px;background:radial-gradient(ellipse,rgba(245,200,66,.07),transparent 70%);pointer-events:none;z-index:-1}
.rh-tag{display:inline-flex;align-items:center;gap:7px;background:var(--gold2);border:1px solid rgba(245,200,66,.3);border-radius:100px;padding:6px 16px;font-family:'Fredoka',sans-serif;font-size:.64rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px}
.rh-title{font-family:'Fredoka',sans-serif;font-size:2.8rem;letter-spacing:.04em;line-height:1;margin-bottom:8px}
.rh-title #rhRound{color:var(--gold);display:block;font-size:1.6rem;margin-top:8px}
.rh-sub{font-size:.9rem;color:var(--soft)}
.rh-month{color:var(--teal);font-weight:600}

/* PODIUM */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:40px}
.podium-spot{display:flex;flex-direction:column;align-items:center;flex:1;max-width:200px}
.podium-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;color:#000;font-weight:700;position:relative;margin-bottom:10px}
.podium-avatar svg{width:100%;height:100%;border-radius:50%}
.podium-medal{position:absolute;bottom:-6px;right:-4px;font-size:1.3rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.p1 .podium-avatar{width:88px;height:88px;font-size:2.4rem;background:linear-gradient(135deg,var(--gold),#e0a830);box-shadow:0 0 40px rgba(245,200,66,.4)}
.p2 .podium-avatar{width:70px;height:70px;font-size:1.9rem;background:linear-gradient(135deg,var(--silver),#9a9aa5)}
.p3 .podium-avatar{width:70px;height:70px;font-size:1.9rem;background:linear-gradient(135deg,var(--bronze),#a8682a)}
.podium-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.92rem;margin-bottom:3px;text-align:center}
.podium-pts{font-family:'Fredoka',sans-serif;font-size:1.1rem;color:var(--teal);letter-spacing:.05em}
.podium-prize{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1rem;margin-top:6px;padding:4px 14px;border-radius:100px}
.p1 .podium-prize{color:var(--gold);background:var(--gold2);border:1px solid rgba(245,200,66,.3)}
.p2 .podium-prize{color:var(--silver);background:rgba(192,192,200,.1);border:1px solid rgba(192,192,200,.2)}
.p3 .podium-prize{color:var(--bronze);background:rgba(205,127,50,.1);border:1px solid rgba(205,127,50,.25)}
.podium-bar{width:100%;border-radius:10px 10px 0 0;margin-top:12px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:'Fredoka',sans-serif;font-size:1.4rem}
.p1 .podium-bar{height:70px;background:linear-gradient(180deg,var(--gold2),transparent);color:var(--gold)}
.p2 .podium-bar{height:50px;background:linear-gradient(180deg,rgba(192,192,200,.12),transparent);color:var(--silver)}
.p3 .podium-bar{height:38px;background:linear-gradient(180deg,rgba(205,127,50,.12),transparent);color:var(--bronze)}

/* prize note */
.prize-note{text-align:center;font-size:.78rem;color:var(--soft);margin-bottom:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1.4}
.prize-note .disclaimer{font-size:.68rem;color:var(--muted)}
.prize-note a{color:var(--teal);text-decoration:underline}

/* full standings */
.section-title{font-family:'Fredoka',sans-serif;font-size:.7rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.03)}
.lb-row.prize-zone{background:rgba(245,200,66,.04)}
.lb-row:last-child{border-bottom:none}
.lb-row.winner{background:rgba(245,200,66,.04)}
.lb-rank{font-family:'Fredoka',sans-serif;font-size:.8rem;color:var(--text);width:28px;flex-shrink:0;text-align:center}
.lb-rank.medal{font-size:1.05rem}
.lb-info{flex:1;min-width:0}
.lb-avatar{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg3);font-family:'Fredoka',sans-serif;font-size:.8rem;color:var(--teal)}
.lb-avatar svg{width:100%;height:100%}
.lb-avatar-initial{background:linear-gradient(135deg,var(--teal),#26a99d);color:#000}
.lb-name{font-size:.88rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-row.me .lb-name{color:var(--gold);font-weight:600}
.lb-stats{font-size:.62rem;color:var(--soft);margin-top:1px}
.lb-prize{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.78rem;color:var(--gold);flex-shrink:0}
.lb-pts{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.82rem;color:var(--teal);flex-shrink:0;min-width:42px;text-align:right}
.lb-row.me .lb-pts{color:var(--gold)}
.lb-dots{text-align:center;padding:6px;color:var(--muted);font-size:.7rem;border-bottom:1px solid rgba(255,255,255,.03)}

/* next giveaway cta */
.next-cta{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border2);border-radius:16px;padding:24px;text-align:center;margin-top:28px}
.next-title{font-family:'Fredoka',sans-serif;font-size:1.6rem;letter-spacing:.05em;margin-bottom:6px}
.next-title span{color:var(--teal)}
.next-sub{font-size:.84rem;color:var(--soft);margin-bottom:16px}
.next-btn{padding:13px 32px;background:var(--teal);border:none;border-radius:11px;color:#000;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:all .2s}
.next-btn:hover{background:#44ffe8;box-shadow:0 4px 20px rgba(46,196,182,.3);transform:translateY(-1px)}

@media(max-width:600px){
  .podium{gap:6px}
  .rh-title{font-size:2.1rem}
  .lb-row{gap:8px;padding:10px 10px}
  .lb-rank{width:20px;font-size:.72rem}
  .lb-name{font-size:.8rem}
  .lb-stats{font-size:.56rem}
  .lb-pts{font-size:.74rem;min-width:0}
  .lb-prize{font-size:.7rem}
}
.ws-mini-foot{text-align:center;padding:18px 16px 26px;margin-top:34px;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted)}
.ws-mini-foot a,.ws-mini-foot button.ws-link{color:var(--muted);text-decoration:none;cursor:pointer;transition:color .2s;background:none;border:none;padding:0;font:inherit}
.ws-mini-foot a:hover,.ws-mini-foot button.ws-link:hover{color:var(--teal)}
.ws-mini-foot .sep{margin:0 9px;opacity:.55}

  <script>
(function () {
  'use strict';

  var KEY = 'winstep_cookie_consent'; // 'accepted' | 'rejected'

  // ---- Google Consent Mode v2 plumbing (ready for GA / AdSense) ----
  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = window.gtag || gtag;

  var stored = null;
  try { stored = localStorage.getItem(KEY); } catch (e) {}

  // Default = everything denied (must run before GA/AdSense load).
  // With ad_storage denied, AdSense auto-serves NON-personalized ads (variant B).
  window.gtag('consent', 'default', {
    analytics_storage: 'denied',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    wait_for_update: 500
  });

  function applyConsent(state) {
    var granted = (state === 'accepted');
    window.gtag('consent', 'update', {
      analytics_storage: granted ? 'granted' : 'denied',
      ad_storage:        granted ? 'granted' : 'denied',
      ad_user_data:      granted ? 'granted' : 'denied',
      ad_personalization:granted ? 'granted' : 'denied'
    });
    // Simple flag any ad-loading code can read: true = personalized, false = contextual
    window.winstepAds = { personalized: granted };
  }

  // Re-apply a previously saved choice on every page load (no banner re-show)
  if (stored === 'accepted' || stored === 'rejected') {
    applyConsent(stored);
  } else {
    window.winstepAds = { personalized: false }; // safe default until they choose
  }

  // ---- Banner UI ----
  function buildBanner() {
    if (document.getElementById('ws-cookie-banner')) return;
    var b = document.createElement('div');
    b.id = 'ws-cookie-banner';
    b.setAttribute('role', 'dialog');
    b.setAttribute('aria-label', 'Cookie consent');
    b.style.cssText =
      'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
      'background:#0e1614;border-top:1px solid rgba(46,196,182,.25);' +
      'box-shadow:0 -8px 30px rgba(0,0,0,.45);padding:16px 20px;' +
      "font-family:Nunito,'Segoe UI',sans-serif;color:#c9d4d1";
    b.innerHTML =
      '<div style="max-width:1000px;margin:0 auto;display:flex;align-items:center;' +
      'gap:18px;flex-wrap:wrap;justify-content:center">' +
        '<div style="flex:1;min-width:240px;font-size:.92rem;line-height:1.5">' +
          '\uD83C\uDF6A Winstep is completely free for everyone, and ads are our only source of income. ' +
          'Accepting cookies helps us keep it that way \u2014 but the choice is yours. Thank you for understanding! ' +
          '<a href="/privacy.html" target="_blank" rel="noopener" ' +
          'style="color:#2ec4b6;text-decoration:underline">Privacy Policy</a>' +
        '</div>' +
        '<div style="display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:center">' +
          '<button id="ws-cookie-reject" type="button" ' +
          'style="padding:11px 22px;background:transparent;border:1.5px solid rgba(159,181,176,.55);' +
          "color:#c9d4d1;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer\">" +
          'Reject All</button>' +
          '<button id="ws-cookie-accept" type="button" ' +
          'style="padding:11px 26px;background:#2ec4b6;border:1.5px solid #2ec4b6;' +
          "color:#0a1413;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer\">" +
          'Accept All</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(b);
    document.getElementById('ws-cookie-accept').onclick = function () { choose('accepted'); };
    document.getElementById('ws-cookie-reject').onclick = function () { choose('rejected'); };
  }

  function removeBanner() {
    var el = document.getElementById('ws-cookie-banner');
    if (el) el.remove();
  }

  function choose(state) {
    try { localStorage.setItem(KEY, state); } catch (e) {}
    applyConsent(state);
    removeBanner();
    // let other on-page scripts know the cookie question is now resolved
    try { window.dispatchEvent(new CustomEvent('winstep:consent', { detail: { state: state } })); } catch (e) {}
  }

  function showBannerIfNeeded() {
    if (stored !== 'accepted' && stored !== 'rejected') buildBanner();
  }

  // ---- Public API (for the "Cookie Settings" footer link) ----
  window.winstepConsent = {
    get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    open: function () { buildBanner(); }  // re-open to change choice anytime
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', showBannerIfNeeded);
  } else {
    showBannerIfNeeded();
  }
})();

<style>
/* ============================================================
   winstep — "crate" skin, shared override layer
   Appended AFTER each page's own stylesheet, so it only reshapes
   what it names. Anything not covered keeps its original rule
   (in the new colours, because the tokens below are overridden).
   ============================================================ */
:root{
  --bg:#0a0f0e; --bg2:#111a18; --bg3:#182421; --bg4:#20302c;
  --teal:#2ec4b6; --teal2:#6fd8cc;

  --on-accent:#04100e;
  --text:#e8f0ee; --text2:#c9d4d1; --muted:#7e9a94; --soft:#9fb5b0;

}

  font-family:var(--body)!important;font-weight:700!important;color:var(--muted)!important}

/* ── headings + section titles ──────────────────────────── */
.section-title,.sec-h,.title,.hud-title,.modal-title,.q-text,.result-title,
.over-title,.next-title,.rh-title,.profile-name,.quiz-tag,.hero{
  font-family:var(--disp)!important;letter-spacing:-.015em!important}
.section-title{font-size:1.2rem!important;letter-spacing:-.01em!important;
  text-transform:none!important;color:var(--text)!important;font-weight:600!important}
.section-title::after{content:none!important}

/* ── pills, badges, tags ────────────────────────────────── */
.profile-rank-pill,.rh-tag,.quiz-tag,.rs-live-badge,.pts,.champ-badge{
  border:0!important;border-radius:999px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)!important}

/* ── numbers that used to be Bebas (condensed) ──────────── */
/* Fredoka is wider, so the sizes tuned for Bebas are stepped down */
.stat-val{font-family:var(--disp)!important;font-weight:700!important;font-size:1.75rem!important;
  letter-spacing:-.02em!important}
.standing-rank{font-family:var(--disp)!important;font-weight:700!important;font-size:2rem!important}
.profile-avatar{font-family:var(--disp)!important;font-weight:700!important;font-size:1.9rem!important;
  color:var(--on-accent)!important;
  background:linear-gradient(150deg,var(--teal-hi),var(--teal))!important;
  box-shadow:0 6px 18px -10px rgba(46,196,182,.6)!important}
.rh-title{font-family:var(--disp)!important;font-weight:700!important;font-size:2.1rem!important;
  letter-spacing:-.025em!important}
.podium-avatar{font-family:var(--disp)!important;font-weight:700!important;color:var(--on-accent)!important}
.p1 .podium-avatar{font-size:1.9rem!important}
.p2 .podium-avatar,.p3 .podium-avatar{font-size:1.5rem!important}
.podium-pts{font-family:var(--disp)!important;font-weight:700!important;font-size:1rem!important}
.podium-bar{font-family:var(--disp)!important;font-weight:700!important;font-size:1.1rem!important;
  border-radius:14px 14px 0 0!important}
.podium-name,.podium-prize,.lb-pts,.lb-rank,.s-pts,.sp-val,.rs-round,.rs-pts,
.history-pts,.result-pts,.q-pts,.over-score,.result-num,.st-val,.tt-val,.timer-value{
  font-family:var(--disp)!important;font-weight:700!important}
.lb-avatar,.lb-avatar-initial{font-family:var(--disp)!important;font-weight:700!important}
.lb-avatar-initial{background:linear-gradient(150deg,var(--teal-hi),var(--teal))!important;
  color:var(--on-accent)!important}
.next-title{font-family:var(--disp)!important;font-weight:600!important;font-size:1.3rem!important;
  letter-spacing:-.02em!important}

/* ── tables + rows ──────────────────────────────────────── */
.rs-table th{font-family:var(--body)!important;font-weight:700!important;
  font-size:.7rem!important;color:var(--muted)!important;border-bottom:1px solid var(--border)!important}
.rs-table td{font-size:.92rem!important;font-weight:600!important;border-bottom:1px solid var(--border)!important}
.lb-row,.history-row,.settings-row{border-bottom:0!important;border-radius:16px!important}
.lb-row.me{background:rgba(46,196,182,.13)!important}

/* ── footers ────────────────────────────────────────────── */
.ws-mini-foot,.footer,.foot-links,.legal,.foot-disclaimer{border-top:0!important;
  font-family:var(--body)!important;font-weight:600!important;color:var(--muted)!important}
.ws-mini-foot a,.ws-mini-foot button.ws-link,.footer a,.foot-links a{
  color:var(--muted)!important;padding:7px 6px!important;display:inline-block!important}
.ws-mini-foot a:hover,.footer a:hover,.foot-links a:hover{color:var(--teal)!important}

/* ── small fixes found by measuring, not by eye ─────────── */
/* results.html: the decorative hero glow is a fixed 400px pseudo-element and
   pushed 5px past the viewport on a 390px phone (pre-existing, fixed here) */
.results-hero::after{width:min(400px,100%)!important}
/* nothing below 11px — these three were 10.2–10.9px */
.rh-tag{font-size:.74rem!important}
.prize-note .disclaimer,.prize-note a{font-size:.78rem!important}
.sr-desc,.acc-note,div[style*="font-size:.68rem"],
div[style*="font-size:.66rem"]{font-size:.78rem!important}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* გვერდის ჩატვირთვის ეფექტი — fade + მსუბუქი zoom (ერთხელ) */
@keyframes pageFadeIn{0%{opacity:0;transform:scale(.985)}100%{opacity:1;transform:scale(1)}}
body{animation:pageFadeIn .42s ease-out both}
@media (prefers-reduced-motion: reduce){
  body{animation:none}
}

<body>

<header>
  <div class="logo" onclick="window.location.href='/dashboard.html'" style="cursor:pointer">
    <div class="logo-badge">
      <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
        <rect x="6" y="27" width="7" height="8" rx="1.5" fill="#000" opacity="0.35"/>
        <rect x="15" y="19" width="7" height="16" rx="1.5" fill="#000" opacity="0.6"/>
        <rect x="24" y="9" width="7" height="26" rx="1.5" fill="#000" opacity="0.85"/>
      </svg>
    </div>
    <div class="logo-name">win<span>step</span></div>
  </div>
  <button class="back-btn" onclick="window.location.href='/dashboard.html'">◀ Back to Dashboard</button>
</header>

<div class="wrap">

  <!-- HERO -->
  <div class="results-hero">
    <div class="rh-tag">🏆 Live Standings</div>
    <div class="rh-title">Championship<span id="rhChampNum"></span> <span id="rhRound">Standings</span></div>
    <div class="rh-sub" id="rhSub">Current championship standings — prizes paid at season's end.</div>
  </div>

  <!-- PODIUM -->
  <div class="podium" id="podium"></div>

  <div class="prize-note">
    <span>🎁 All prizes paid as Amazon.com Gift Cards.</span>
    <span class="disclaimer">*Amazon is not a sponsor. See <a href="/official-rules.html">Official Rules</a>.</span>
  </div>

  <!-- FULL STANDINGS -->
  <div class="section-title">Full Standings</div>
  <div class="card" id="standingsCard">
    <div style="text-align:center;padding:24px;color:var(--muted)">Loading standings...</div>
  </div>

  <!-- PAST CHAMPIONSHIPS -->
  <div id="pastSection" style="display:none">
    <div class="section-title" style="margin-top:36px">🏆 Past Championships</div>
    <div class="card" id="pastChampsList"></div>
    <div id="pastResultsBox"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/avatars.js"></script>
<script>
const SUPABASE_URL = 'https://eybpnmplndedpnhuasyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_X4EkeI2UOnaZQ28A7d8Ckw_q1sM5yQY';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null;
let prizeZones = [];

function ordinal(n){ const s=['th','st','nd','rd']; const v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function fmtAmount(a){ a=(a||'').toString().trim(); if(!a) return a; if(/[$€£]/.test(a)) return a; if(/^\d+(\.\d+)?$/.test(a)) return '$'+a; return a; }

// find prize for a given place using zones
function prizeForPlace(place){
  for(const z of prizeZones){
    const from = z.place_from || z.place;
    const to = z.place_to || z.place;
    if(place >= from && place <= to) return fmtAmount(z.amount);
  }
  return null;
}

async function init(){
  const { data: { session } } = await db.auth.getSession();
  if(session) me = session.user;

  // current round (for header label)
  // ვადაგასული რაუნდი არ ჩაითვალოს აქტიურად (როგორც dashboard-ზე)
  const todayUTC = new Date().toISOString().split('T')[0];
  const { data: round } = await db.from('rounds').select('*')
    .eq('status','active')
    .gte('end_date', todayUTC)
    .order('created_at',{ascending:false})
    .limit(1)
    .maybeSingle();

  if(round){
    if(round.championship_id){
      const { data: ch } = await db.from('championships').select('number').eq('id', round.championship_id).maybeSingle();
      if(ch) document.getElementById('rhChampNum').textContent = ' ' + champIdLabel(ch.number);
    }
    document.getElementById('rhRound').textContent = 'Round ' + round.round_number + '/' + round.total_rounds;
    document.getElementById('rhSub').textContent = 'Standings through Round ' + round.round_number + ' — championship points decide the winners.';
  } else {
    // ჩემპიონატებს შორის შუალედი — არ არის აქტიური რაუნდი
    const { data: up } = await db.from('championships')
      .select('number, start_date')
      .eq('status','upcoming')
      .order('start_date',{ascending:true})
      .limit(1).maybeSingle();

    document.getElementById('rhRound').textContent = 'Between championships';
    if(up && up.start_date){
      const dt = new Date(up.start_date + 'T00:00:00Z');
      const nice = dt.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
      document.getElementById('rhSub').textContent =
        'The championship has ended. Championship ' + champIdLabel(up.number) + ' starts ' + nice + '. See the past results below.';
    } else {
      document.getElementById('rhSub').textContent =
        'The championship has ended. A new one starts soon — see the past results below.';
    }
  }

  // prize zones — მიმდინარე ჩემპიონატის საკუთარი პრიზები
  // (RPC თავად აკეთებს fallback-ს გლობალურზე, თუ ჩემპიონატს თავისი არ აქვს)
  const champIdForPrizes = round ? round.championship_id : null;
  const { data: zones } = await db.rpc('get_championship_prizes', { p_champ_id: champIdForPrizes });
  prizeZones = zones || [];

  // standings — champ pts → cumulative round pts → activity → correct → earliest last point (NO email — public safe)
  const { data: rawPlayers } = await db.from('public_profiles')
    .select('id, username, avatar_id, championship_points, season_points, total_points, total_activity, correct_answers, last_point_at')
    .order('championship_points',{ascending:false})
    .order('total_activity',{ascending:false})
    .order('correct_answers',{ascending:false})
    .limit(100);

  // მხოლოდ აქტიური მონაწილეები — ვისაც აქვს ქულა ან აქტივობა
  const players = (rawPlayers || []).filter(p =>
    (p.total_points||0) > 0 ||
    (p.championship_points||0) > 0 ||
    (p.season_points||0) > 0 ||
    (p.total_activity||0) > 0
  );

  if(players){
    players.sort((a,b)=>
      ((b.championship_points||0)-(a.championship_points||0)) ||
      (((b.season_points||0)+(b.total_points||0))-((a.season_points||0)+(a.total_points||0))) ||
      ((b.total_activity||0)-(a.total_activity||0)) ||
      ((b.correct_answers||0)-(a.correct_answers||0)) ||
      ((a.last_point_at?new Date(a.last_point_at).getTime():Infinity)-(b.last_point_at?new Date(b.last_point_at).getTime():Infinity))
    );
  }

  renderPodium(players||[]);
  renderStandings(players||[]);
  loadPastChampionships();
}

// ⚙️ ტესტ-რეჟიმი: "Past Championships" სექცია დამალულია სანამ საკმარისი
//    რეალური ჩემპიონატის მონაცემი დაგროვდება. გამოსაჩენად → შეცვალე true-თი.
//    (ლოგიკა და RLS უკვე გამართულია — ეს მხოლოდ ჩვენებას აკონტროლებს.)
const SHOW_PAST_CHAMPIONSHIPS = false;

async function loadPastChampionships(){
  if(!SHOW_PAST_CHAMPIONSHIPS) return; // ტესტ-რეჟიმში სექცია საერთოდ არ ჩნდება
  const { data: champs } = await db.from('championships').select('*').eq('status','finished').order('number',{ascending:false});
  if(!champs || champs.length===0) return; // no past championships → section stays hidden

  document.getElementById('pastSection').style.display = 'block';

  let html = '';
  for(const c of champs){
    let winnerName = '—';
    if(c.winner_user_id){
      const { data: w } = await db.from('public_profiles').select('username').eq('id', c.winner_user_id).maybeSingle();
      if(w) winnerName = w.username;
    }
    const period = (c.start_date||'') + (c.end_date?(' → '+c.end_date):'');
    html += '<div class="lb-row" style="cursor:pointer" onclick="viewPastResults(\''+c.id+'\','+c.number+')">'
      + '<span class="lb-rank">🏆</span>'
      + '<div class="lb-info"><div class="lb-name">Championship '+champIdLabel(c.number)+'</div><div class="lb-stats">'+period+' · winner: '+escapeHtml(winnerName)+'</div></div>'
      + '<span class="lb-pts" style="font-size:.8rem">View ▾</span>'
      + '</div>';
  }
  document.getElementById('pastChampsList').innerHTML = html;
}

let openPastId = null;
async function viewPastResults(champId, champNum){
  const box = document.getElementById('pastResultsBox');
  // toggle: if already open, close
  if(openPastId === champId){ box.innerHTML=''; openPastId=null; return; }
  openPastId = champId;

  box.innerHTML = '<div style="text-align:center;padding:18px;color:var(--muted)">Loading...</div>';

  // official final standings (recorded when the championship ended)
  const { data: payouts } = await db.from('championship_payouts')
    .select('user_id, place, championship_points, prize_amount')
    .eq('championship_id', champId)
    .order('place',{ascending:true});
  if(!payouts || payouts.length===0){ box.innerHTML = '<div class="card" style="margin-top:10px"><div style="text-align:center;padding:18px;color:var(--muted)">No results recorded for this championship.</div></div>'; return; }

  // only prize places are public + the logged-in user's own final result
  const prizeRows = payouts.filter(r=>r.prize_amount);
  const myRow = me ? payouts.find(r=>r.user_id===me.id) : null;
  const myInPrizes = myRow && myRow.prize_amount;

  // usernames + avatars
  const ids = prizeRows.map(r=>r.user_id);
  if(myRow && !myInPrizes) ids.push(myRow.user_id);
  const { data: profiles } = await db.from('public_profiles').select('id, username, avatar_id').in('id', ids);
  const profById = {}; (profiles||[]).forEach(p=>{ profById[p.id]=p; });

  const rowHtml = (r)=>{
    const prof = profById[r.user_id]||{};
    const isMe = me && r.user_id===me.id;
    const isWinner = r.place<=3;
    return '<div class="lb-row'+(isWinner?' winner':'')+(isMe?' me':'')+'">'
      + '<span class="lb-rank">'+r.place+'</span>'
      + avatarCell(prof)
      + '<div class="lb-info"><div class="lb-name">'+escapeHtml(dispName(prof.username))+'</div></div>'
      + (r.prize_amount ? '<span class="lb-prize">'+escapeHtml(r.prize_amount)+'</span>' : '')
      + '</div>';
  };

  let html = '<div class="card" style="margin-top:10px"><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:.9rem;padding:6px 4px 12px">Championship '+champIdLabel(champNum)+' — Final Results</div>';
  prizeRows.forEach(r=>{ html += rowHtml(r); });

  // your own final result (visible only to you)
  if(myRow && !myInPrizes){
    html += '<div style="font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 4px 6px">Your final result</div>';
    html += rowHtml(myRow);
  }

  html += '</div>';
  box.innerHTML = html;
}

function renderPodium(players){
  const podium = document.getElementById('podium');
  if(players.length===0){ podium.innerHTML=''; return; }
  const order = [1,0,2]; // 2nd, 1st, 3rd visual order
  const cls = {0:'p1',1:'p2',2:'p3'};
  const medals = {0:'🥇',1:'🥈',2:'🥉'};
  let html = '';
  for(const idx of order){
    if(!players[idx]) continue;
    const p = players[idx];
    const prize = prizeForPlace(idx+1);
    const avSize = (idx===0)?88:70;
    const avSvg = avatarSVG(p.avatar_id, avSize);
    const avInner = avSvg || (p.username||'?').charAt(0).toUpperCase();
    html += '<div class="podium-spot '+cls[idx]+'">'
      + '<div class="podium-avatar"'+(avSvg?' style="background:transparent;box-shadow:none"':'')+'>'+avInner+'<div class="podium-medal">'+medals[idx]+'</div></div>'
      + '<div class="podium-name">'+escapeHtml(dispName(p.username))+'</div>'
      + '<div class="podium-pts"><span style="color:var(--gold)">'+(p.championship_points||0)+'</span><span style="color:var(--muted)"> / </span><span style="color:var(--text)">'+((p.season_points||0)+(p.total_points||0))+'</span> pts</div>'
      + (prize ? '<div class="podium-prize">'+prize+'</div>' : '')
      + '<div class="podium-bar">'+(idx+1)+'</div>'
      + '</div>';
  }
  podium.innerHTML = html;
}

// find the lowest place that still gets a prize (e.g. zone 1-50 → 50)
function maxPrizePlace(){
  let max = 0;
  for(const z of prizeZones){
    const to = z.place_to || z.place;
    if(to > max) max = to;
  }
  return max;
}

let allPlayers = [];
let showingAll = false;

function renderStandings(players){
  allPlayers = players;
  const card = document.getElementById('standingsCard');
  if(players.length===0){ card.innerHTML='<div style="text-align:center;padding:24px;color:var(--muted)">No players yet.</div>'; return; }

  const prizeCount = maxPrizePlace(); // how many places get prizes
  const cutoff = showingAll ? players.length : Math.max(prizeCount, 3); // always show at least top 3
  const visible = players.slice(0, cutoff);

  let html = '';
  visible.forEach((p, i)=>{
    const place = i+1;
    const isMe = me && p.id===me.id;
    const isWinner = place<=3;
    const inPrizeZone = place<=prizeCount;
    const prize = prizeForPlace(place);
    const cls = (isMe?'me':'') + (isWinner?' winner':'');
    html += '<div class="lb-row'+(cls?' '+cls:'')+(inPrizeZone&&!isWinner?' prize-zone':'')+'">'
      + '<span class="lb-rank">'+place+'</span>'
      + avatarCell(p)
      + '<div class="lb-info"><div class="lb-name">'+escapeHtml(dispName(p.username))+'</div>'
      + '<div class="lb-stats">🎯 '+(p.total_activity||0)+' · ✅ '+(p.correct_answers||0)+'</div></div>'
      + '<span class="lb-pts"><span style="color:var(--gold)">'+(p.championship_points||0)+'</span><span style="color:var(--muted);font-weight:400"> / </span><span style="color:var(--text)">'+((p.season_points||0)+(p.total_points||0))+'</span> <span style="font-size:.6rem;color:var(--muted);font-weight:400">PTS</span></span>'
      + (prize ? '<span class="lb-prize">'+prize+'</span>' : '')
      + '</div>';
  });

  // show all / show less toggle
  if(players.length > Math.max(prizeCount,3)){
    const remaining = players.length - Math.max(prizeCount,3);
    html += '<div style="text-align:center;padding:14px"><button onclick="toggleShowAll()" style="background:var(--bg3);border:1px solid var(--border2);color:var(--teal);font-family:Nunito,sans-serif;font-weight:600;font-size:.82rem;padding:9px 20px;border-radius:9px;cursor:pointer">'
      + (showingAll ? '▲ Show prize zone only' : '▼ Show all '+players.length+' players ('+remaining+' more)')
      + '</button></div>';
  }

  card.innerHTML = html;
}

function toggleShowAll(){
  showingAll = !showingAll;
  renderStandings(allPlayers);
}

function avatarCell(p){
  const s = avatarSVG(p.avatar_id, 28);
  if(s) return '<div class="lb-avatar">'+s+'</div>';
  return '<div class="lb-avatar lb-avatar-initial">'+((p.username||'?').charAt(0).toUpperCase())+'</div>';
}

function dispName(n){ n = n || '—'; return n.length > 18 ? n.slice(0,18) : n; }
// display-only championship label: number -> "ID: 00174" (base untouched; 173 + number, 5 digits)
function champIdLabel(number){ return 'ID: ' + String((parseInt(number,10)||0) + 173).padStart(5,'0'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

init();
</script>
