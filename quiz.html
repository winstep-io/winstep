<style>
:root{
  --bg:#080c0b; --bg2:#0d1412; --bg3:#111a18; --bg4:#162220;
  --teal:#2ec4b6; --teal2:#1a9e90; --teal3:rgba(46,196,182,.12); --teal4:rgba(46,196,182,.06);
  --gold:#f5c842;

}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
.quiz-wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.top-bar{display:flex;align-items:center;justify-content:space-between;width:100%}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);color:var(--soft);font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;letter-spacing:.05em;padding:9px 16px;border-radius:8px;transition:all .2s;text-decoration:none}
.back-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal4)}
.quiz-tag{font-family:'Fredoka',sans-serif;font-size:.62rem;letter-spacing:.2em;color:var(--teal);text-transform:uppercase;background:var(--teal4);border:1px solid var(--border2);padding:4px 12px;border-radius:100px}
.ad-banner{width:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.quiz-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.timer-section{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg3)}
.timer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.timer-label{font-size:.66rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

.timer-value.warn{color:var(--gold)}
.timer-value.danger{color:var(--red)}
.timer-track{width:100%;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.timer-fill{height:100%;background:var(--teal);border-radius:3px;width:100%;transition:width 1s linear,background .3s}
.timer-fill.warn{background:var(--gold)}
.timer-fill.danger{background:var(--red)}
.question-section{padding:24px 20px}
.q-number{font-family:'Fredoka',sans-serif;font-size:.62rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.q-text{font-family:'Fredoka',sans-serif;font-size:1.25rem;font-weight:600;line-height:1.35;color:var(--text);margin-bottom:6px}
.q-pts{font-size:.72rem;color:var(--gold);letter-spacing:.05em}
.answers{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px}
.answer{display:flex;align-items:center;gap:13px;padding:15px 16px;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .18s;text-align:left;font-family:'Nunito',sans-serif;width:100%}
.answer:hover:not(.disabled){border-color:var(--border2);background:var(--bg4);transform:translateX(3px)}
.answer.disabled{cursor:default;pointer-events:none}
.answer-letter{width:30px;height:30px;border-radius:8px;background:var(--teal4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:1rem;color:var(--teal);flex-shrink:0;transition:all .18s}
.answer-text{font-size:.95rem;color:var(--text);font-weight:500;flex:1}
.answer-mark{font-size:1.1rem;opacity:0;transition:opacity .2s}
.answer.correct{background:var(--green2);border-color:var(--green)}
.answer.correct .answer-letter{background:var(--green);border-color:var(--green);color:#000}
.answer.correct .answer-text{color:var(--green)}
.answer.correct .answer-mark{opacity:1}
.answer.wrong{background:var(--red2);border-color:var(--red)}
.answer.wrong .answer-letter{background:var(--red);border-color:var(--red);color:#fff}
.answer.wrong .answer-text{color:var(--red)}
.answer.wrong .answer-mark{opacity:1}
.answer.faded{opacity:.35}
.result-msg{padding:16px 20px;border-top:1px solid var(--border);display:none;align-items:center;gap:12px;background:var(--bg3)}
.result-msg.show{display:flex}
.result-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.result-icon.correct{background:var(--green2)}
.result-icon.wrong{background:var(--red2)}
.result-info{flex:1}
.result-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;margin-bottom:1px}
.result-title.correct{color:var(--green)}
.result-title.wrong{color:var(--red)}
.result-sub{font-size:.72rem;color:var(--muted)}
.result-pts{font-family:'Fredoka',sans-serif;font-size:1.6rem;letter-spacing:.05em}
.result-pts.correct{color:var(--green)}
.result-pts.wrong{color:var(--gold)}
.continue-btn{width:100%;padding:14px;background:var(--teal);border:none;border-radius:12px;color:#000;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:all .2s;display:none}
.continue-btn.show{display:block}
.continue-btn:hover{background:#44ffe8;box-shadow:0 4px 20px rgba(46,196,182,.3)}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:.9rem}
.ws-mini-foot{margin-top:auto;text-align:center;padding:22px 16px 4px;font-size:.72rem;color:var(--muted)}
.ws-mini-foot a,.ws-mini-foot button.ws-link{color:var(--muted);text-decoration:none;cursor:pointer;transition:color .2s;background:none;border:none;padding:0;font:inherit}
.ws-mini-foot a:hover,.ws-mini-foot button.ws-link:hover{color:var(--teal)}
.ws-mini-foot .sep{margin:0 9px;opacity:.55}

  <script>
(function () {
  'use strict';

  var KEY = 'winstep_cookie_consent'; // 'accepted' | 'rejected'

  // With ad_storage denied, AdSense auto-serves NON-personalized ads (variant B).

    analytics_storage: 'denied',

  });

    var granted = (state === 'accepted');
    window.gtag('consent', 'update', {
      analytics_storage: granted ? 'granted' : 'denied',
      ad_storage:        granted ? 'granted' : 'denied',
      ad_user_data:      granted ? 'granted' : 'denied',
      ad_personalization:granted ? 'granted' : 'denied'
    });
    // Simple flag any ad-loading code can read: true = personalized, false = contextual
    window.winstepAds = { personalized: granted };
  }

  // Re-apply a previously saved choice on every page load (no banner re-show)
  if (stored === 'accepted' || stored === 'rejected') {
    applyConsent(stored);
  } else {
    window.winstepAds = { personalized: false }; // safe default until they choose
  }

  // ---- Banner UI ----
  function buildBanner() {
    if (document.getElementById('ws-cookie-banner')) return;
    var b = document.createElement('div');
    b.id = 'ws-cookie-banner';
    b.setAttribute('role', 'dialog');
    b.setAttribute('aria-label', 'Cookie consent');
    b.style.cssText =
      'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
      'background:#0e1614;border-top:1px solid rgba(46,196,182,.25);' +
      'box-shadow:0 -8px 30px rgba(0,0,0,.45);padding:16px 20px;' +
      "font-family:Nunito,'Segoe UI',sans-serif;color:#c9d4d1";
    b.innerHTML =
      '<div style="max-width:1000px;margin:0 auto;display:flex;align-items:center;' +
      'gap:18px;flex-wrap:wrap;justify-content:center">' +
        '<div style="flex:1;min-width:240px;font-size:.92rem;line-height:1.5">' +

          'style="color:#2ec4b6;text-decoration:underline">Privacy Policy</a>' +
        '</div>' +
        '<div style="display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:center">' +
          '<button id="ws-cookie-reject" type="button" ' +
          'style="padding:11px 22px;background:transparent;border:1.5px solid rgba(159,181,176,.55);' +
          "color:#c9d4d1;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer\">" +
          'Reject All</button>' +
          '<button id="ws-cookie-accept" type="button" ' +
          'style="padding:11px 26px;background:#2ec4b6;border:1.5px solid #2ec4b6;' +
          "color:#0a1413;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer\">" +
          'Accept All</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(b);
    document.getElementById('ws-cookie-accept').onclick = function () { choose('accepted'); };
    document.getElementById('ws-cookie-reject').onclick = function () { choose('rejected'); };
  }

  function removeBanner() {
    var el = document.getElementById('ws-cookie-banner');
    if (el) el.remove();
  }

  function choose(state) {
    try { localStorage.setItem(KEY, state); } catch (e) {}
    applyConsent(state);
    removeBanner();
    // let other on-page scripts know the cookie question is now resolved
    try { window.dispatchEvent(new CustomEvent('winstep:consent', { detail: { state: state } })); } catch (e) {}
  }

  function showBannerIfNeeded() {
    if (stored !== 'accepted' && stored !== 'rejected') buildBanner();
  }

  // ---- Public API (for the "Cookie Settings" footer link) ----
  window.winstepConsent = {
    get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    open: function () { buildBanner(); }  // re-open to change choice anytime
  };

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── games: page-specific ────────────────────────────────── */

  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)!important;

/* ============ ვიზუალური ეფექტები ============
   crate-ფენა !important-ს ხშირად იყენებს, ამიტომ ეს ბლოკი ბოლოშია
   და საჭირო ადგილებში თავადაც !important-ით იწერება. */

/* #4 — გვერდის შემოსვლა */
@keyframes ws-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.quiz-wrap.ws-in{animation:ws-in .34s ease both}

/* #7 — კითხვის skeleton */
@keyframes ws-shim{0%{background-position:-340px 0}100%{background-position:340px 0}}
.sk{background:var(--bg4);background-image:linear-gradient(90deg,var(--bg4) 0,var(--bg3) 44px,var(--bg4) 88px);
  background-size:340px 100%;animation:ws-shim 1.15s infinite linear;border-radius:7px;display:block}
.sk-ans{height:60px;border-radius:12px;margin-bottom:10px}
.sk-ans:last-child{margin-bottom:0}

/* #6 ეტაპი 1 — მყისიერი უკუკავშირი, სერვერის პასუხამდე */
.answer.press{transform:scale(.975)!important}
.answer.pending{background:var(--bg4)!important;
  box-shadow:0 0 0 1.5px var(--teal),inset 0 1px 0 rgba(255,255,255,.06)!important}
.answer.pending .answer-letter{background:var(--teal)!important;color:#04140a!important}
.answer.pending .answer-mark{opacity:1}
.answer.pending .answer-mark::after{content:'';display:inline-block;width:12px;height:12px;
  border:2px solid rgba(46,196,182,.3);border-top-color:var(--teal);border-radius:50%;
  animation:ws-sp .6s linear infinite;vertical-align:-1px}
@keyframes ws-sp{to{transform:rotate(360deg)}}

/* #6 ეტაპი 2 — გამოვლენა */
@keyframes ws-pop{0%{transform:scale(1)}30%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes ws-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.answer.ws-pop{animation:ws-pop .48s cubic-bezier(.2,.9,.3,1.3)}
.answer.ws-shake{animation:ws-shake .42s cubic-bezier(.36,.07,.19,.97)}
.answer.faded{transition:opacity .3s ease}

@media (prefers-reduced-motion:reduce){
  .quiz-wrap.ws-in,.sk,.answer.ws-pop,.answer.ws-shake,.answer.pending .answer-mark::after{animation:none}
  .answer.press{transform:none!important}
  /* reduced-motion: ფანჯარა ჩნდება, მაგრამ ეფექტის გარეშე */
  #bonusModal .bonus-card,#bonusModal .bonus-tr{animation:none!important}
}

/* ── ბონუსის განბლოკვის ფანჯარა (A + confetti) ── */
#bonusModal{position:fixed;inset:0;z-index:2147483647;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(0,0,0,.55)}
#bonusModal.on{display:flex}
.bonus-card{max-width:320px;width:100%;text-align:center;
  background:#0f1917;border:1px solid rgba(245,200,66,.35);border-radius:20px;
  padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.5);position:relative;z-index:2;
  animation:bonusPop .5s cubic-bezier(.34,1.56,.64,1) both}
.bonus-tr{font-size:48px;line-height:1;margin-bottom:14px;display:inline-block;
  animation:bonusTrophy .6s .1s both}
.bonus-title{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600;
  color:#f5c842;margin-bottom:10px;line-height:1.25}
.bonus-sub{font-size:14px;line-height:1.55;color:#c9d4d1;margin-bottom:24px}
.bonus-btn{width:100%;padding:13px;background:#2ec4b6;border:none;border-radius:12px;
  font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;color:#06231f;cursor:pointer}
.bonus-conf{position:absolute;width:9px;height:9px;border-radius:2px;top:0;z-index:1;pointer-events:none}
@keyframes bonusPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bonusTrophy{0%{transform:scale(0) rotate(-20deg)}55%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bonusConf{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(140px) rotate(340deg);opacity:0}}
</style>
</head>
<body>

<!-- ბონუსის განბლოკვის ფანჯარა — ჩნდება მხოლოდ იმ სწორ პასუხზე,
     რომელმაც თამაში გახსნა (და თუ ეს ბოქსის ბოლო კითხვა არ იყო) -->
<div id="bonusModal">
  <div class="bonus-card">
    <span class="bonus-tr">🎉</span>
    <div class="bonus-title">Bonus game unlocked!</div>
    <div class="bonus-sub">Finish the box to play it.</div>
    <button class="bonus-btn" onclick="closeBonus()">Keep going</button>
  </div>
</div>

<div class="quiz-wrap ws-in">
  <div class="top-bar">
    <button class="back-btn" onclick="abandonQuiz().then(()=>window.location.href='/dashboard.html')">◀ Back to tasks</button>
    <span class="quiz-tag" id="quizTag">Quiz</span>
  </div>

  <div class="ad-banner" id="adSlotTop" style="display:none"><div id="adTop" style="width:100%"></div></div>

  <div class="quiz-card">
    <div id="quizContent">
      <!-- #7 — კითხვის skeleton. სტატიკური markup: JS-ზე ადრე იხატება.
           renderQuestion() სრულად ანაცვლებს, როცა get_quiz_question დაბრუნდება. -->
      <div class="timer-section">
        <div class="timer-top">
          <span class="sk" style="height:11px;width:118px"></span>
          <span class="sk" style="height:11px;width:34px"></span>
        </div>
        <div class="timer-track"><div class="timer-fill"></div></div>
      </div>
      <div class="question-section">
        <span class="sk" style="height:9px;width:92px;margin-bottom:12px"></span>
        <span class="sk" style="height:18px;width:93%;margin-bottom:8px"></span>
        <span class="sk" style="height:18px;width:62%;margin-bottom:12px"></span>
        <span class="sk" style="height:9px;width:196px"></span>
      </div>
      <div class="answers">
        <span class="sk sk-ans"></span>
        <span class="sk sk-ans"></span>
        <span class="sk sk-ans"></span>
        <span class="sk sk-ans"></span>
      </div>
    </div>
  </div>

  <!-- ქვედა ბანერი დროებით გათიშულია — აღსადგენად მოაშორე ეს კომენტარი
  <div class="ad-banner" id="adSlotBottom" style="display:none"><div id="adBottom" style="width:100%"></div></div>
  -->

  <button class="continue-btn" id="continueBtn" onclick="window.location.href='/dashboard.html'">← Back to Tasks</button>

<!-- Interstitial (full-screen ad) overlay -->
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://eybpnmplndedpnhuasyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_X4EkeI2UOnaZQ28A7d8Ckw_q1sM5yQY';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let accessToken = null;
let taskId = null;
let task = null;
let question = null;
let answered = false;
let quizStarted = false;
let activityId = null;
let timeLeft = 20;
let timerInterval = null;
let pointSettings = { quiz_correct: 10, quiz_wrong: 5, quiz_timeout: 0, quiz_time_seconds: 20 };

// get task id from URL
const params = new URLSearchParams(window.location.search);
taskId = params.get('task');
// ჩვენების ნომერი dashboard-ის რიგიდან. მხოლოდ წარწერაა — შეფასებაზე გავლენა
// არ აქვს, ამიტომ URL-ში ყოფნა უსაფრთხოა. შენახული სათაური აღარ იხატება,
// რომ არეული რიგი ეკრანზე არ გამოჩნდეს.
const dispNum = parseInt(params.get('n'), 10);

async function init(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ window.location.href = '/index.html'; return; }
  currentUser = session.user;
  accessToken = session.access_token;
  loadAds();

  if(!taskId){ document.getElementById('quizContent').innerHTML = '<div class="loading">No quiz selected.</div>'; return; }

  // already answered? (მხოლოდ ვალიდურ task_id-ზე)
  if(taskId){
    const { data: existing } = await db.from('user_activity').select('id').eq('user_id', currentUser.id).eq('task_id', taskId);
    if(existing && existing.length>0){
      document.getElementById('quizContent').innerHTML = '<div class="loading">You already completed this quiz. ✓</div>';
      document.getElementById('continueBtn').classList.add('show');
      return;
    }
  }

  // load question (server-side — სწორი პასუხი ბრაუზერში აღარ მოდის)
  const { data: qData, error: qErr } = await db.rpc('get_quiz_question', { p_task_id: taskId });
  if(qErr || !qData){ document.getElementById('quizContent').innerHTML = '<div class="loading">Quiz not found.</div>'; return; }
  question = qData;
  document.getElementById('quizTag').textContent = (dispNum > 0) ? ('Quiz ' + dispNum) : 'Quiz';

  // load global point settings
  const { data: setRows } = await db.from('settings').select('*').in('key',['quiz_correct','quiz_wrong','quiz_timeout','quiz_time_seconds']);
  if(setRows){ for(const r of setRows){ pointSettings[r.key] = r.value; } }

  renderQuestion();
  startTimer();
}

function renderQuestion(){
  const html = `
    <div class="timer-section">
      <div class="timer-top">
        <span class="timer-label">⏱️ Time to answer</span>
        <span class="timer-value" id="timerVal">20s</span>
      </div>
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    </div>
    <div class="question-section">
      <div class="q-number">${(dispNum > 0) ? ('Quiz ' + dispNum) : 'Quiz'}</div>
      <div class="q-text">${question.question}</div>
      <div class="q-pts">🎁 +${pointSettings.quiz_correct} points for correct answer</div>
    </div>
    <div class="answers" id="answers">
      <button class="answer" data-letter="A" onclick="pick(this)"><span class="answer-letter">A</span><span class="answer-text">${question.answer_a}</span><span class="answer-mark"></span></button>
      <button class="answer" data-letter="B" onclick="pick(this)"><span class="answer-letter">B</span><span class="answer-text">${question.answer_b}</span><span class="answer-mark"></span></button>
      <button class="answer" data-letter="C" onclick="pick(this)"><span class="answer-letter">C</span><span class="answer-text">${question.answer_c}</span><span class="answer-mark"></span></button>
      <button class="answer" data-letter="D" onclick="pick(this)"><span class="answer-letter">D</span><span class="answer-text">${question.answer_d}</span><span class="answer-mark"></span></button>
    </div>
    <div class="result-msg" id="resultMsg">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-info"><div class="result-title" id="resultTitle"></div><div class="result-sub" id="resultSub"></div></div>
      <div class="result-pts" id="resultPts"></div>
    </div>
  `;
  document.getElementById('quizContent').innerHTML = html;
}

function startTimer(){
  quizStarted = true;
  const totalTime = parseInt(pointSettings.quiz_time_seconds) || 20;
  timeLeft = totalTime;
  timerInterval = setInterval(()=>{
    timeLeft--;
    const val = document.getElementById('timerVal');
    const fill = document.getElementById('timerFill');
    if(!val||!fill) return;
    val.textContent = timeLeft+'s';
    fill.style.width = (timeLeft/totalTime*100)+'%';
    if(timeLeft<=5){ fill.className='timer-fill danger'; val.className='timer-value danger'; }
    else if(timeLeft<=10){ fill.className='timer-fill warn'; val.className='timer-value warn'; }
    if(timeLeft<=0){ clearInterval(timerInterval); timeOut(); }
  },1000);
}

async function pick(btn){
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);

  // ეტაპი 1 — მყისიერი, სერვერის პასუხამდე. ეს არაფერს აყოვნებს:
  // მომხმარებელი მაშინვე ხედავს, რომ შეხება დაფიქსირდა.
  document.querySelectorAll('.answer').forEach(a=>a.classList.add('disabled'));
  btn.classList.add('press');
  setTimeout(()=>{ btn.classList.remove('press'); btn.classList.add('pending'); }, 110);

  const chosen = btn.getAttribute('data-letter');
  // გზა B — სერვერი ამოწმებს პასუხს და ანიჭებს ქულას
  const { data: res, error: rpcErr } = await db.rpc('submit_quiz_answer', { p_task_id: taskId, p_chosen: chosen });

  // თუ RPC ჩავარდა, პასუხი არ ჩაწერილა — ე.ი. მომხმარებელს არ შეიძლება
  // ვუთხრათ, რომ შეცდა. ადრე error გადაგდებული იყო და ჩავარდნა ჩუმად
  // „არასწორ პასუხად + 0 ქულად" გადაიქცეოდა.
  if(rpcErr || !res){
    console.error('submit_quiz_answer:', rpcErr);
    btn.classList.remove('press','pending');
    document.querySelectorAll('.answer').forEach(a=>{
      a.classList.remove('disabled','faded');
      a.style.transitionDelay = '';
    });
    const icon=document.getElementById('resultIcon'), title=document.getElementById('resultTitle'),
          sub=document.getElementById('resultSub'), pts=document.getElementById('resultPts');
    icon.className='result-icon wrong'; icon.textContent='!';
    title.className='result-title wrong'; title.textContent='Connection problem';
    sub.textContent='Your answer was not saved. Please tap it again.';
    pts.className='result-pts wrong'; pts.textContent='';
    document.getElementById('resultMsg').classList.add('show');
    answered = false;                 // ხელახლა პასუხის საშუალება
    return;
  }

  const correctLetter = res.correct_answer;
  const isCorrect = (res.is_correct === true);
  const points = res.points || 0;
  // already: პასუხი უკვე ჩაწერილია (მაგ. ქსელმა პირველი პასუხი დაკარგა და
  // მომხმარებელმა ხელახლა დააჭირა). სერვერი ვერდიქტს აღარ აბრუნებს, ამიტომ
  // „Not quite" ჩვენება მცდარი იქნებოდა — პასუხი შეიძლება სწორიც ყოფილიყო.
  const already = (res.already === true);

  // ეტაპი 2 — გამოვლენა
  btn.classList.remove('press','pending');
  document.querySelectorAll('.answer').forEach((a,i)=>{
    a.classList.add('disabled');
    const letter = a.getAttribute('data-letter');
    if(letter===correctLetter){ a.classList.add('correct','ws-pop'); a.querySelector('.answer-mark').textContent='✓'; }
    else if(a===btn){ a.classList.add('wrong','ws-shake'); a.querySelector('.answer-mark').textContent='✗'; }
    else { a.style.transitionDelay = (i*55)+'ms'; a.classList.add('faded'); }
  });

  // interstitial ტრიგერი დაშბორდზე გადავიდა (გზა-დამოუკიდებლობისთვის)
  showResult(already ? 'already' : (isCorrect ? 'correct' : 'wrong'), points);

  // ბონუსის განბლოკვა: ჩნდება მხოლოდ თუ ამ პასუხმა გახსნა თამაში
  // (just_unlocked) და ეს ბოქსის ბოლო კითხვა არ იყო (box_completed=false),
  // თორემ ბოქსის დახურვის ფანჯარა ისედაც გამოვა — ორი ფანჯარა ზედმეტია.
  if(res.just_unlocked === true && res.box_completed !== true){
    setTimeout(showBonusUnlock, 900);   // ჯერ პასუხის შედეგი დაინახოს
  }
}

function showBonusUnlock(){
  const m = document.getElementById('bonusModal');
  if(!m) return;
  m.classList.add('on');
  // confetti — თუ მოძრაობა არ არის შეზღუდული
  if(!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    bonusConfetti();
  }
}

function closeBonus(){
  const m = document.getElementById('bonusModal');
  if(m) m.classList.remove('on');
}

function bonusConfetti(){
  const card = document.querySelector('#bonusModal .bonus-card');
  if(!card) return;
  const colors = ['#2ec4b6','#f5c842','#9fe1cb','#ffd966'];
  for(let i=0;i<20;i++){
    const c = document.createElement('div');
    c.className = 'bonus-conf';
    c.style.background = colors[i%4];
    c.style.left = (18 + Math.random()*64) + '%';
    c.style.animation = 'bonusConf ' + (0.9 + Math.random()*0.6) + 's ' + (Math.random()*0.2) + 's ease-in forwards';
    card.appendChild(c);
    setTimeout(()=>c.remove(), 1900);
  }
}

async function timeOut(){
  answered = true;
  const { data: res } = await db.rpc('submit_quiz_answer', { p_task_id: taskId, p_chosen: null });
  const correctLetter = res ? res.correct_answer : null;
  document.querySelectorAll('.answer').forEach(a=>{
    a.classList.add('disabled');
    if(a.getAttribute('data-letter')===correctLetter){ a.classList.add('correct'); a.querySelector('.answer-mark').textContent='✓'; }
    else a.classList.add('faded');
  });
  showResult('timeout', res ? res.points : 0);
}

// ──────────────────────────────────────────────
// გზა B: saveResult / checkBoxCompletion მოშორებულია —
// ქულის დარიცხვა და box-ის დასრულება ახლა სერვერზე ხდება (submit_quiz_answer).
// ──────────────────────────────────────────────

// "Back to tasks" — პასუხის გარეშე გასვლა = timeout (სერვერზე ჩაიწერება)
async function abandonQuiz(){
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);
  await db.rpc('submit_quiz_answer', { p_task_id: taskId, p_chosen: null });
}

function showResult(type, points){
  const msg=document.getElementById('resultMsg');
  const icon=document.getElementById('resultIcon');
  const title=document.getElementById('resultTitle');
  const sub=document.getElementById('resultSub');
  const pts=document.getElementById('resultPts');

  if(type==='correct'){
    icon.className='result-icon correct';icon.textContent='✓';
    title.className='result-title correct';title.textContent='Correct!';
    sub.textContent='Great job — you nailed it.';
    pts.className='result-pts correct';pts.textContent='+'+points;
  } else if(type==='wrong'){
    icon.className='result-icon wrong';icon.textContent='✗';
    title.className='result-title wrong';title.textContent='Not quite!';
    sub.textContent='The correct answer is in green.';
    pts.className='result-pts wrong';pts.textContent='+'+points;
  } else if(type==='already'){
    icon.className='result-icon wrong';icon.textContent='✓';
    title.className='result-title wrong';title.textContent='Already answered';
    sub.textContent='This one was already recorded. The correct answer is in green.';
    pts.className='result-pts wrong';pts.textContent='';
  } else {
    icon.className='result-icon wrong';icon.textContent='⏱️';
    title.className='result-title wrong';title.textContent="Time's up!";
    sub.textContent='No answer — counts as skipped.';
    pts.className='result-pts wrong';pts.textContent='0';
  }
  msg.classList.add('show');
  document.getElementById('continueBtn').classList.add('show');
  // interstitial ტრიგერი დაშბორდზე გადავიდა (გზა-დამოუკიდებლობისთვის)
}

// ==================== AD SLOTS ====================
async function loadAds(){
  try{
    const { data: rows } = await db.from('ad_settings').select('*');
    if(!rows) return;
    const byKey = {};
    rows.forEach(r => byKey[r.slot_key] = r);
    const globalScript = (byKey['__global__'] && byKey['__global__'].custom_code) || '';
    renderAdSlot(byKey['quiz_top'], 'adSlotTop', 'adTop', globalScript);
    // ქვედა ბანერი დროებით გათიშულია — აღსადგენად მოაშორე ამ ხაზის დასაწყისის //
    // renderAdSlot(byKey['quiz_bottom'], 'adSlotBottom', 'adBottom', globalScript);
    // (ვიდეო-სკრიპტის site-wide ჩატვირთვა დაშბორდზე გადავიდა — interstitial ახლა იქ ჩნდება)
  }catch(e){}
}
function renderAdSlot(cfg, slotId, boxId, globalScript){
  const slot = document.getElementById(slotId);
  const box = document.getElementById(boxId);
  if(!slot || !box) return;
  if(!cfg || cfg.enabled === false){ slot.style.display='none'; return; }
  if(cfg.mode === 'manual'){
    const code = (cfg.custom_code||'').trim();
    if(!code){ slot.style.display='none'; return; }
    box.innerHTML = code; activateScripts(box); slot.style.display='flex';
  } else {
    const code = (globalScript||'').trim();
    if(!code){ slot.style.display='none'; return; }
    if(!window.__adGlobalLoaded){
      const w = document.createElement('div'); w.innerHTML = code; activateScripts(w);
      document.head.appendChild(w); window.__adGlobalLoaded = true;
    }
    slot.style.display='flex';
  }
}
function activateScripts(container){
  container.querySelectorAll('script').forEach(old=>{
    const s = document.createElement('script');
    for(const attr of old.attributes) s.setAttribute(attr.name, attr.value);
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
}

// interstitial (box/quiz full-screen რეკლამა) ახლა dashboard.html-ში მუშაობს —
// გზა-დამოუკიდებლად (ბოქსი/ვიქტორინა როგორც არ უნდა დაიხუროს). აქ აღარ არის.

// სისტემური Back / გვერდის დახურვა — placeholder-ს timeout-ად ვაქცევთ (pending → quiz).
// sync XHR PATCH უზრუნველყოფს ჩაწერას გვერდის დახურვამდე (sendBeacon მხოლოდ POST-ია).
// სისტემური Back / გვერდის დახურვა პასუხის გარეშე = timeout (0 ქულა, +1 activity).
// sync XHR insert უზრუნველყოფს ჩაწერას გვერდის დახურვამდე.
function abandonOnLeave(){
  if(answered || !quizStarted || !taskId || !accessToken) return;
  answered = true;
  clearInterval(timerInterval);
  try{
    // გზა B — timeout-ად ჩაწერა სერვერის ფუნქციით (sync XHR ასწრებს გვერდის დახურვამდე)
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/rest/v1/rpc/submit_quiz_answer', false);
    xhr.setRequestHeader('Content-Type','application/json');
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization','Bearer ' + accessToken);
    xhr.send(JSON.stringify({ p_task_id: taskId, p_chosen: null }));
  }catch(e){}
}
window.addEventListener('pagehide', abandonOnLeave);

init();
