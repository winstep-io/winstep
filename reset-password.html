<link rel="stylesheet" href="/fonts.css">
<style>
:root{
  --bg:#080c0b; --bg2:#0f1614; --text:#e8f0ee; --muted:#6a807b; --soft:#9fb5b0;
  --teal:#2ec4b6; --teal2:#1a9e90; --teal3:rgba(46,196,182,.12); --teal4:rgba(46,196,182,.06);
  --border:rgba(46,196,182,.12); --border2:rgba(46,196,182,.2); --red:#e63946;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:28px}
.logo-badge{width:62px;height:62px;background:var(--teal);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(46,196,182,.35)}
.logo-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.9rem;letter-spacing:-.01em;line-height:1}
.logo-name span{color:var(--teal)}
.card{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:30px 26px}
.title{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:600;margin-bottom:6px}
.sub{font-size:.84rem;color:var(--muted);margin-bottom:22px;line-height:1.5}
.field-label{display:block;font-size:.74rem;font-weight:600;letter-spacing:.05em;color:var(--soft);text-transform:uppercase;margin-bottom:7px}
.input-field{width:100%;padding:13px 15px;background:var(--bg);border:1.5px solid var(--border);border-radius:11px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:.95rem;margin-bottom:16px}
.input-field:focus{outline:none;border-color:var(--teal2)}
.btn{width:100%;padding:14px;background:var(--teal);border:none;border-radius:11px;color:#000;font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;letter-spacing:.03em;transition:all .2s}
.btn:hover{background:#44ffe8}
.msg{padding:11px 14px;border-radius:10px;font-size:.84rem;margin-bottom:16px;display:none}
.msg.error{background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.3);color:#ff6b78;display:block}
.msg.success{background:rgba(46,196,122,.12);border:1px solid rgba(46,196,122,.3);color:#2ec47a;display:block}
.back{display:block;text-align:center;margin-top:18px;font-size:.8rem;color:var(--muted);text-decoration:none;cursor:pointer}
.back:hover{color:var(--teal)}
</style>
  <!-- cookie-consent (inlined: removes a render-blocking request; must still
       run BEFORE the GA4 block below so Consent Mode v2 defaults apply first) -->
  <script>
(function () {
  'use strict';

  var KEY = 'winstep_cookie_consent'; // 'accepted' | 'rejected'

  // ---- Google Consent Mode v2 plumbing (ready for GA / AdSense) ----
  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = window.gtag || gtag;

  var stored = null;
  try { stored = localStorage.getItem(KEY); } catch (e) {}

  // Default = everything denied (must run before GA/AdSense load).
  // With ad_storage denied, AdSense auto-serves NON-personalized ads (variant B).
  window.gtag('consent', 'default', {
    analytics_storage: 'denied',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    wait_for_update: 500
  });

  function applyConsent(state) {
    var granted = (state === 'accepted');
    window.gtag('consent', 'update', {
      analytics_storage: granted ? 'granted' : 'denied',
      ad_storage:        granted ? 'granted' : 'denied',
      ad_user_data:      granted ? 'granted' : 'denied',
      ad_personalization:granted ? 'granted' : 'denied'
    });
    // Simple flag any ad-loading code can read: true = personalized, false = contextual
    window.winstepAds = { personalized: granted };
  }

  // Re-apply a previously saved choice on every page load (no banner re-show)
  if (stored === 'accepted' || stored === 'rejected') {
    applyConsent(stored);
  } else {
    window.winstepAds = { personalized: false }; // safe default until they choose
  }

  // ---- Banner UI ----
  function buildBanner() {
    if (document.getElementById('ws-cookie-banner')) return;
    var b = document.createElement('div');
    b.id = 'ws-cookie-banner';
    b.setAttribute('role', 'dialog');
    b.setAttribute('aria-label', 'Cookie consent');
    b.style.cssText =
      'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
      'background:#0e1614;border-top:1px solid rgba(46,196,182,.25);' +
      'box-shadow:0 -8px 30px rgba(0,0,0,.45);padding:16px 20px;' +
      "font-family:Rajdhani,'Segoe UI',sans-serif;color:#c9d4d1";
    b.innerHTML =
      '<div style="max-width:1000px;margin:0 auto;display:flex;align-items:center;' +
      'gap:18px;flex-wrap:wrap;justify-content:center">' +
        '<div style="flex:1;min-width:240px;font-size:.92rem;line-height:1.5">' +
          '\uD83C\uDF6A Winstep is completely free for everyone, and ads are our only source of income. ' +
          'Accepting cookies helps us keep it that way \u2014 but the choice is yours. Thank you for understanding! ' +
          '<a href="/privacy.html" target="_blank" rel="noopener" ' +
          'style="color:#2ec4b6;text-decoration:underline">Privacy Policy</a>' +
        '</div>' +
        '<div style="display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:center">' +
          '<button id="ws-cookie-reject" type="button" ' +
          'style="padding:11px 22px;background:transparent;border:1.5px solid rgba(159,181,176,.55);' +
          "color:#c9d4d1;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer\">" +
          'Reject All</button>' +
          '<button id="ws-cookie-accept" type="button" ' +
          'style="padding:11px 26px;background:#2ec4b6;border:1.5px solid #2ec4b6;' +
          "color:#0a1413;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer\">" +
          'Accept All</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(b);
    document.getElementById('ws-cookie-accept').onclick = function () { choose('accepted'); };
    document.getElementById('ws-cookie-reject').onclick = function () { choose('rejected'); };
  }

  function removeBanner() {
    var el = document.getElementById('ws-cookie-banner');
    if (el) el.remove();
  }

  function choose(state) {
    try { localStorage.setItem(KEY, state); } catch (e) {}
    applyConsent(state);
    removeBanner();
    // let other on-page scripts know the cookie question is now resolved
    try { window.dispatchEvent(new CustomEvent('winstep:consent', { detail: { state: state } })); } catch (e) {}
  }

  function showBannerIfNeeded() {
    if (stored !== 'accepted' && stored !== 'rejected') buildBanner();
  }

  // ---- Public API (for the "Cookie Settings" footer link) ----
  window.winstepConsent = {
    get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    open: function () { buildBanner(); }  // re-open to change choice anytime
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', showBannerIfNeeded);
  } else {
    showBannerIfNeeded();
  }
})();
  </script>
</head>
<body>
  <div class="logo">
    <div class="logo-badge">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
        <rect x="6" y="27" width="7" height="8" rx="1.5" fill="#000" opacity="0.35"/>
        <rect x="15" y="19" width="7" height="16" rx="1.5" fill="#000" opacity="0.6"/>
        <rect x="24" y="9" width="7" height="26" rx="1.5" fill="#000" opacity="0.85"/>
      </svg>
    </div>
    <div class="logo-name">win<span>step</span></div>
  </div>

  <div class="card">
    <div class="title">Set a new password</div>
    <div class="sub" id="sub">Enter your new password below.</div>
    <div class="msg" id="msg"></div>

    <div id="formBox">
      <label class="field-label">New Password</label>
      <input type="password" class="input-field" id="pw1" placeholder="New password (min 6 chars)" autocomplete="new-password">
      <label class="field-label">Confirm Password</label>
      <input type="password" class="input-field" id="pw2" placeholder="Confirm new password" autocomplete="new-password">
      <button class="btn" onclick="updatePassword()">Update Password</button>
    </div>

    <a class="back" onclick="window.location.href='/index.html'">← Back to login</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://eybpnmplndedpnhuasyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_X4EkeI2UOnaZQ28A7d8Ckw_q1sM5yQY';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(text, type){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
}

// when the user lands here from the reset link, Supabase puts a recovery
// session in the URL. The client picks it up automatically.
let recoveryReady = false;
db.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY' || session){
    recoveryReady = true;
  }
});

// also check on load if there's a session (link already processed)
(async ()=>{
  const { data: { session } } = await db.auth.getSession();
  if(session) recoveryReady = true;
  else {
    // give the client a moment to parse the URL hash
    setTimeout(async ()=>{
      const { data: { session } } = await db.auth.getSession();
      if(session) recoveryReady = true;
      else { showMsg('This reset link is invalid or has expired. Please request a new one.', 'error'); }
    }, 1200);
  }
})();

async function updatePassword(){
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if(!pw1 || pw1.length < 6){ showMsg('Password must be at least 6 characters.', 'error'); return; }
  if(pw1 !== pw2){ showMsg('Passwords do not match.', 'error'); return; }

  const { error } = await db.auth.updateUser({ password: pw1 });
  if(error){ showMsg(error.message, 'error'); return; }

  showMsg('Password updated! Redirecting to login...', 'success');
  document.getElementById('formBox').style.display = 'none';
  setTimeout(async ()=>{
    await db.auth.signOut();
    window.location.href = '/index.html';
  }, 2000);
}
</script>
</body>
</html>
