<style>
:root{
  --bg:#080c0b; --bg2:#0d1412; --bg3:#111a18; --bg4:#162220;
  --teal:#2ec4b6; --teal2:#1a9e90; --teal3:rgba(46,196,182,.12); --teal4:rgba(46,196,182,.06);
  --gold:#f5c842;
  --text:#e8f0ee; --muted:#4a6660;
  --border:rgba(46,196,182,.1); --border2:rgba(46,196,182,.2);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--border);background:rgba(8,12,11,.95);backdrop-filter:blur(20px);width:100%;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{width:38px;height:38px;background:var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 20px rgba(46,196,182,.3)}
.logo-name{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.logo-name,.logo-name *{color:var(--text)}
.logo-name span{color:var(--teal)}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);color:var(--soft);font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;letter-spacing:.05em;padding:8px 16px;border-radius:8px;transition:all .2s}
.back-btn:hover{border-color:var(--teal);color:var(--teal)}

#wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:480px;padding:20px 16px}

/* info bar */

.hud{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--bg3);border-radius:14px;padding:12px 18px;border:1px solid var(--border)}
.hud-title{font-family:'Fredoka',sans-serif;font-size:1.4rem;letter-spacing:.15em;color:var(--text)}
.hud-title span{color:var(--teal)}
.hud-r{display:flex;gap:16px}
.hs .l{font-size:.55rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;display:block;text-align:right}
.hs .v{font-family:'Fredoka',sans-serif;font-size:1.1rem;color:var(--teal);letter-spacing:.1em;display:block;text-align:right}
.hs .v.g{color:var(--gold)}
#cw{width:100%;position:relative;border-radius:16px;overflow:hidden;border:1.5px solid var(--border2);box-shadow:0 4px 24px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:auto}
/* step timer */
.step-timer{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:11px 16px;display:none}
.step-timer.show{display:block}
.st-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.st-label{font-size:.66rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.st-val{font-family:'Fredoka',sans-serif;font-size:1.2rem;color:var(--teal);letter-spacing:.05em}
.st-val.warn{color:var(--gold)}
.st-val.danger{color:#e63946}
.st-track{width:100%;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.st-fill{height:100%;background:var(--teal);border-radius:3px;width:100%;transition:width 1s linear,background .3s}
.st-fill.warn{background:var(--gold)}
.st-fill.danger{background:#e63946}

.sb{width:100%;display:flex;gap:3px}
.pip{flex:1;height:4px;border-radius:2px;background:#1a2420;transition:background .3s}
.pip.done{background:var(--teal)}
.pip.cur{background:rgba(46,196,182,.5);animation:pp 1s infinite}
@keyframes pp{0%,100%{opacity:.4}50%{opacity:1}}
.btns{display:flex;gap:10px;width:100%}
.btn{flex:1;padding:14px;border:1.5px solid var(--border2);background:var(--bg3);border-radius:12px;font-family:'Fredoka',sans-serif;font-size:1rem;letter-spacing:.12em;color:var(--teal);cursor:pointer;transition:all .15s}
.btn:hover:not(:disabled){background:var(--teal);color:#000}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.25;cursor:not-allowed}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,11,.93);backdrop-filter:blur(6px);gap:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20;padding:24px}
#ov.show{opacity:1;pointer-events:all}
#ovT{font-family:'Fredoka',sans-serif;font-size:2rem;letter-spacing:.12em;color:var(--text);text-align:center;line-height:1.2}
#ovS{font-size:.82rem;letter-spacing:.08em;color:var(--muted);text-align:center;line-height:1.6;padding:0 16px}
#ovP{font-family:'Fredoka',sans-serif;font-size:1.8rem;color:var(--teal);letter-spacing:.1em;display:none}
#ovB{margin-top:6px;padding:12px 32px;background:var(--teal);color:#000;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.05em}
#ovB:hover{background:#44ffe8;box-shadow:0 4px 16px rgba(46,196,182,.3)}
.demo-note{font-size:.64rem;color:var(--muted);text-align:center;letter-spacing:.05em;margin-top:2px;max-width:300px;line-height:1.5}
</style>
  <!-- cookie-consent (inlined: removes a render-blocking request; must still

  <script>
(function () {
  'use strict';

  var KEY = 'winstep_cookie_consent'; // 'accepted' | 'rejected'

  // ---- Google Consent Mode v2 plumbing (ready for GA / AdSense) ----
  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = window.gtag || gtag;

  var stored = null;
  try { stored = localStorage.getItem(KEY); } catch (e) {}

  // Default = everything denied (must run before GA/AdSense load).
  // With ad_storage denied, AdSense auto-serves NON-personalized ads (variant B).
  window.gtag('consent', 'default', {
    analytics_storage: 'denied',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    wait_for_update: 500
  });

  function applyConsent(state) {
    var granted = (state === 'accepted');
    window.gtag('consent', 'update', {
      analytics_storage: granted ? 'granted' : 'denied',
      ad_storage:        granted ? 'granted' : 'denied',
      ad_user_data:      granted ? 'granted' : 'denied',
      ad_personalization:granted ? 'granted' : 'denied'
    });
    // Simple flag any ad-loading code can read: true = personalized, false = contextual
    window.winstepAds = { personalized: granted };
  }

  // Re-apply a previously saved choice on every page load (no banner re-show)
  if (stored === 'accepted' || stored === 'rejected') {
    applyConsent(stored);
  } else {
    window.winstepAds = { personalized: false }; // safe default until they choose
  }

  // ---- Banner UI ----
  function buildBanner() {
    if (document.getElementById('ws-cookie-banner')) return;
    var b = document.createElement('div');
    b.id = 'ws-cookie-banner';
    b.setAttribute('role', 'dialog');
    b.setAttribute('aria-label', 'Cookie consent');
    b.style.cssText =
      'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
      'background:#0e1614;border-top:1px solid rgba(46,196,182,.25);' +
      'box-shadow:0 -8px 30px rgba(0,0,0,.45);padding:16px 20px;' +
      "font-family:Nunito,'Segoe UI',sans-serif;color:#c9d4d1";
    b.innerHTML =
      '<div style="max-width:1000px;margin:0 auto;display:flex;align-items:center;' +
      'gap:18px;flex-wrap:wrap;justify-content:center">' +
        '<div style="flex:1;min-width:240px;font-size:.92rem;line-height:1.5">' +
          '\uD83C\uDF6A Winstep is completely free for everyone, and ads are our only source of income. ' +
          'Accepting cookies helps us keep it that way \u2014 but the choice is yours. Thank you for understanding! ' +
          '<a href="/privacy.html" target="_blank" rel="noopener" ' +
          'style="color:#2ec4b6;text-decoration:underline">Privacy Policy</a>' +
        '</div>' +
        '<div style="display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:center">' +
          '<button id="ws-cookie-reject" type="button" ' +
          'style="padding:11px 22px;background:transparent;border:1.5px solid rgba(159,181,176,.55);' +
          "color:#c9d4d1;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer\">" +
          'Reject All</button>' +
          '<button id="ws-cookie-accept" type="button" ' +
          'style="padding:11px 26px;background:#2ec4b6;border:1.5px solid #2ec4b6;' +
          "color:#0a1413;border-radius:10px;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer\">" +
          'Accept All</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(b);
    document.getElementById('ws-cookie-accept').onclick = function () { choose('accepted'); };
    document.getElementById('ws-cookie-reject').onclick = function () { choose('rejected'); };
  }

  function removeBanner() {
    var el = document.getElementById('ws-cookie-banner');
    if (el) el.remove();
  }

  function choose(state) {
    try { localStorage.setItem(KEY, state); } catch (e) {}
    applyConsent(state);
    removeBanner();
    // let other on-page scripts know the cookie question is now resolved
    try { window.dispatchEvent(new CustomEvent('winstep:consent', { detail: { state: state } })); } catch (e) {}
  }

  function showBannerIfNeeded() {
    if (stored !== 'accepted' && stored !== 'rejected') buildBanner();
  }

  // ---- Public API (for the "Cookie Settings" footer link) ----
  window.winstepConsent = {
    get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    open: function () { buildBanner(); }  // re-open to change choice anytime
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', showBannerIfNeeded);
  } else {
    showBannerIfNeeded();
  }
})();

<style>
/* ============================================================
   winstep — "crate" skin, shared override layer
   Appended AFTER each page's own stylesheet, so it only reshapes
   what it names. Anything not covered keeps its original rule
   (in the new colours, because the tokens below are overridden).
   ============================================================ */
:root{
  --bg:#0a0f0e; --bg2:#111a18; --bg3:#182421; --bg4:#20302c;
  --teal:#2ec4b6; --teal2:#6fd8cc;
  --teal-btn:#2ec4b6; --teal-lip:#15756c; --teal-hi:#48ded0;
  --teal3:rgba(46,196,182,.15); --teal4:rgba(46,196,182,.07);
  --gold:#f5c842; --gold2:rgba(245,200,66,.13); --gold-lip:#a8831c;
  --green:#3ddc84; --green2:rgba(61,220,132,.16);
  --silver:#c9d2d0; --bronze:#d69a5c;
  --red:#ff6b78; --red2:rgba(255,107,120,.16);
  --on-accent:#04100e;
  --text:#e8f0ee; --text2:#c9d4d1; --muted:#7e9a94; --soft:#9fb5b0;
  --paper:#f6ecd9; --paper-ink:#241a08;
  --border:rgba(255,255,255,.06); --border2:rgba(46,196,182,.34);
  --lift:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 18px -14px rgba(0,0,0,.75);
  --disp:'Fredoka',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
}

/* ── ground ─────────────────────────────────────────────── */
body{background:var(--bg);font-family:var(--body)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 900px 460px at 50% -12%,rgba(46,196,182,.18),transparent 66%),
    radial-gradient(ellipse 700px 420px at 88% 30%,rgba(245,200,66,.05),transparent 62%)}

/* ── header + logo ──────────────────────────────────────── */
header,.topbar,.app-top{background:rgba(10,15,14,.9)!important;border-bottom:1px solid var(--border)!important}
.logo-badge{border-radius:13px!important;
  box-shadow:0 4px 12px -7px rgba(46,196,182,.55),inset 0 1px 0 rgba(255,255,255,.28)!important}
.logo-name{font-family:var(--disp)!important;font-weight:700!important;letter-spacing:-.01em!important}

/* ── chunky plastic keys (pressable, with a lip) ────────── */
.back-btn,.back-link,.back,.logout-btn,.logout-btn2,.acc-btn,.next-btn,.continue-btn,
.btn,.btn-lg,.btn-solid,.btn-ghost,.btn-hero,.submit-btn,.verify-btn,
.guess-btn,.h-btn,.over-btn,.spin-btn,.task-b,.bridge-b,.verify-resend,.btns .btn{
  font-family:var(--disp)!important;font-weight:600!important;letter-spacing:0!important;
  border-radius:13px!important;transition:transform .08s,box-shadow .08s,background .15s!important}
.back-btn,.back-link,.back,.logout-btn,.logout-btn2,.acc-btn,.btn-ghost,.h-btn{
  background:var(--bg3)!important;border:0!important;color:var(--text2)!important;
  box-shadow:0 2px 0 rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05)!important}
.back-btn:hover,.back-link:hover,.back:hover,.logout-btn:hover,.logout-btn2:hover,
.acc-btn:hover,.btn-ghost:hover,.h-btn:hover{background:var(--bg4)!important;color:var(--text)!important}
.btn,.btn-lg,.btn-solid,.btn-hero,.submit-btn,.next-btn,.continue-btn,.verify-btn,
.guess-btn,.over-btn,.spin-btn,.task-b,.bridge-b{
  background:var(--teal-btn)!important;border:0!important;color:var(--on-accent)!important;

.next-btn:hover,.continue-btn:hover,.guess-btn:hover,.spin-btn:hover{

.back-btn:active,.back-link:active,.back:active,.logout-btn:active,.logout-btn2:active,
.acc-btn:active,.btn:active,.btn-lg:active,.btn-solid:active,.btn-hero:active,
.submit-btn:active,.next-btn:active,.continue-btn:active,.guess-btn:active,
.h-btn:active,.over-btn:active,.spin-btn:active{transform:translateY(2px)!important;
  box-shadow:0 0 0 currentColor!important}
/* .google-btn is intentionally NOT restyled here — see crate-index.css */

/* ── surfaces ───────────────────────────────────────────── */
.card,.stat-card,.standing-card,.auth-card,.quiz-card,.result-card,.over-card,

.answer-letter{border:0!important;border-radius:11px!important;font-family:var(--disp)!important;
  font-weight:700!important;background:var(--teal3)!important;color:var(--teal)!important}
.answer-text{font-weight:600!important;font-size:1rem!important}
.answer.correct{background:var(--green2)!important;
  box-shadow:0 0 0 1.5px var(--green),inset 0 1px 0 rgba(255,255,255,.06)!important}
.answer.correct .answer-letter{background:var(--green)!important;color:#04140a!important}
.answer.correct .answer-text{color:var(--green)!important}
.answer.wrong{background:var(--red2)!important;
  box-shadow:0 0 0 1.5px var(--red),inset 0 1px 0 rgba(255,255,255,.06)!important}
.answer.wrong .answer-letter{background:var(--red)!important;color:#2a0508!important}
.answer.wrong .answer-text{color:var(--red)!important}
.timer-section{border-bottom:0!important;background:transparent!important}
.timer-track,.st-track,.tt-track{border-radius:99px!important;background:rgba(255,255,255,.07)!important}
.timer-fill,.st-fill,.tt-fill{border-radius:99px!important}
.q-text{font-size:1.3rem!important;font-weight:600!important;line-height:1.3!important}
.quiz-tag{background:var(--teal3)!important;color:var(--teal)!important;
  font-family:var(--body)!important;font-weight:700!important;font-size:.7rem!important}

/* hilo — the playing card must stay a real white card, untouched by the
   card/shadow rules above; only its corner type is restyled */
.playing-card{border-radius:20px!important;background:#f6f4ef!important;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.75)!important;
  /* the card ships without .red/.black until JS deals — without this the
     placeholder pips inherit the light page text colour on a white card */
  color:var(--card-black,#1a2422)!important}
.pc-corner,.pc-rank,.pc-center{font-family:var(--disp)!important;font-weight:700!important}
.guess-btn.low{background:var(--bg3)!important;color:var(--text)!important;
  box-shadow:0 2px 0 rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05)!important}
.guess-btn.low:hover:not(:disabled){background:var(--bg4)!important;color:var(--text)!important}
.guess-btn:disabled{opacity:.35!important;box-shadow:none!important;transform:none!important}
.score-box .k{font-family:var(--body)!important;font-weight:700!important;
  font-size:.7rem!important;color:var(--muted)!important}
.score-box .v{font-family:var(--disp)!important;font-weight:700!important;font-size:1.5rem!important}
.eyebrow{font-family:var(--body)!important;font-weight:700!important;color:var(--teal)!important;
  font-size:.74rem!important}
.title{font-size:1.9rem!important;font-weight:600!important}
.subtitle{font-size:.95rem!important;color:var(--muted)!important;font-weight:600!important}
.feedback{font-family:var(--disp)!important;font-weight:600!important;font-size:1rem!important}
.over-card{border-radius:24px!important}
.over-title{font-family:var(--disp)!important;font-weight:600!important}
.over-score{font-size:2rem!important}

/* spin wheel — the wheel itself is canvas/SVG, only its frame is restyled */
.wheel-ring{box-shadow:0 0 0 4px var(--bg3),0 0 0 6px rgba(46,196,182,.3),
  0 12px 34px -14px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.55)!important}
.wheel-ring.spinning{box-shadow:0 0 0 4px var(--bg3),0 0 0 6px var(--teal),
  0 0 30px var(--teal3),0 12px 34px -14px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.55)!important}
.hub{border:0!important;background:var(--bg3)!important;
  box-shadow:0 3px 10px -4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07)!important}
.result-num{font-family:var(--disp)!important;font-weight:700!important;font-size:2.1rem!important}
.result-label{font-weight:600!important;color:var(--soft)!important}

/* bridge — HUD, pips and the two pick buttons */
.demo-note{font-size:.78rem!important;font-weight:600!important}
.hud{background:var(--bg2)!important}
.hud-title{font-family:var(--disp)!important;font-weight:700!important;
  font-size:1.15rem!important;letter-spacing:0!important}
.hs .l{font-family:var(--body)!important;font-weight:700!important;font-size:.74rem!important;
  color:var(--muted)!important}
.hs .v{font-family:var(--disp)!important;font-weight:700!important;font-size:1.05rem!important;
  letter-spacing:0!important}
#cw{border:0!important;border-radius:20px!important;
  box-shadow:0 8px 22px -14px rgba(0,0,0,.8)!important}
.pip{border-radius:99px!important;background:rgba(255,255,255,.08)!important}
.pip.done{background:var(--teal)!important}
.pip.cur{background:rgba(46,196,182,.5)!important}
.step-timer{background:var(--bg2)!important;border:0!important;border-radius:18px!important;
  box-shadow:var(--lift)!important}
.st-label{font-family:var(--body)!important;font-weight:700!important;font-size:.7rem!important}
.btns .btn{font-size:.95rem!important;letter-spacing:0!important;padding:15px!important}
.btns .btn:disabled{opacity:.35!important;box-shadow:none!important;transform:none!important}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="window.location.href='/dashboard.html'" style="cursor:pointer">
    <div class="logo-badge">
      <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
        <rect x="6" y="27" width="7" height="8" rx="1.5" fill="#000" opacity="0.35"/>
        <rect x="15" y="19" width="7" height="16" rx="1.5" fill="#000" opacity="0.6"/>
        <rect x="24" y="9" width="7" height="26" rx="1.5" fill="#000" opacity="0.85"/>
      </svg>
    </div>
    <div class="logo-name">win<span>step</span></div>
  </div>
  <button class="back-btn">◀ Back to Tasks</button>
</header>

<div id="wrap">
  <div class="hud">
    <div class="hud-title">THE <span>BRIDGE</span></div>
    <div class="hud-r">
      <div class="hs"><span class="l">Step</span><span class="v" id="hS">0/10</span></div>
      <div class="hs"><span class="l">Points</span><span class="v g" id="hP">0</span></div>
    </div>
  </div>

  <div class="step-timer" id="stepTimer">
    <div class="st-top">
      <span class="st-label">⏱️ Time for this step</span>
      <span class="st-val" id="stVal">10s</span>
    </div>
    <div class="st-track"><div class="st-fill" id="stFill"></div></div>
  </div>

  <div class="sb" id="sb"></div>

  <div id="cw">
    <canvas id="c"></canvas>
    <div id="ov" class="show">
      <div id="ovT" style="color:#2ec4b6">THE BRIDGE</div>
      <div id="ovS">One wrong step ends the game.<br>Choose left or right to cross.</div>
      <div id="ovP"></div>
      <button id="ovB" onclick="start()">START GAME</button>
    </div>
  </div>

  <div class="btns" id="ctrlBtns" style="display:none">
    <button class="btn" id="bL" onclick="pick(0)">◀ LEFT</button>
    <button class="btn" id="bR" onclick="pick(1)">RIGHT ▶</button>
  </div>

  <div class="demo-note">⚠️ Demo: "Try Again" restarts here. On the live platform the window closes after the game and points are added automatically.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://eybpnmplndedpnhuasyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_X4EkeI2UOnaZQ28A7d8Ckw_q1sM5yQY';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let bridgeUser = null;
let myProgressId = null;            // user_box_progress row that unlocked the bridge
let BRIDGE_STEP = 10;               // points per safe step (from settings)
let BRIDGE_FINISH = 50;             // finish bonus (from settings)
let bridgeSaved = false;            // prevent double-saving
let currentSession = null;          // ავტ. ტოკენი pagehide-ის sync XHR-ისთვის
let gameActive = false;             // bridge_start გავიდა — თამაში ცოცხალია
let forfeited  = false;             // forfeit უკვე გაიგზავნა (ერთხელ)

async function bridgeInit(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ window.location.href = '/index.html'; return; }
  bridgeUser = session.user;
  currentSession = session;

  // load point settings
  const { data: setRows } = await db.from('settings').select('*').in('key',['bridge_step','bridge_finish']);
  if(setRows){ for(const r of setRows){ if(r.key==='bridge_step') BRIDGE_STEP=r.value; if(r.key==='bridge_finish') BRIDGE_FINISH=r.value; } }

  // check eligibility: must have an unlocked, unplayed bridge in an active interval
  const today = new Date().toISOString().split('T')[0];
  const { data: prog } = await db.from('user_box_progress')
    .select('*')
    .eq('user_id', bridgeUser.id)
    .eq('day', today)
    .eq('bridge_unlocked', true)
    .eq('bridge_played', false);

  // find one whose interval is still running
  const live = (prog||[]).find(p => p.interval_ends_at && new Date(p.interval_ends_at) > new Date());

  if(!live){
    // not eligible — show message, block game
    document.getElementById('wrap').innerHTML = '<div style="text-align:center;padding:50px 20px;color:var(--muted)"><div style="font-size:2.4rem;margin-bottom:14px">🌉</div><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;color:var(--text);margin-bottom:8px">Bridge not available</div><div style="font-size:.85rem;max-width:320px;margin:0 auto;line-height:1.5">The bridge unlocks during the break after a box — but only if you answered enough quiz questions correctly. Keep playing to earn your next attempt!</div><button onclick="window.location.href=\'/dashboard.html\'" style="margin-top:20px;padding:11px 22px;background:var(--bg3);border:1px solid var(--border2);color:var(--teal);border-radius:9px;font-family:Nunito,sans-serif;font-weight:600;cursor:pointer">← Back to Dashboard</button></div>';
    return;
  }

  myProgressId = live.id;
  STEP_TIME = 10; // could also come from settings later
}

// გზა B: ქულის დარიცხვა და bridge_played ახლა სერვერზე ხდება (bridge_step / bridge_end).

// ---- გამოსვლა თამაშის პროცესში = მიტოვება (Back / Back to Dashboard / დახურვა) ----
// თამაში იხურება ქულის გარეშე (0): დაშბორდზე აღარ ჩანს, ხელახლა ვერ შევა.
// G.phase!=='play' = ბუნებრივი დასასრული (win/dead/timeout) — მაშინ forfeit არ ეშვება.
function forfeitGame(){
  if(!gameActive || forfeited || !G || G.phase !== 'play') return;
  forfeited = true;
  try{
    var token = (currentSession && currentSession.access_token) || SUPABASE_KEY;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/rest/v1/rpc/bridge_forfeit', false); // sync
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.send('{}');
  }catch(e){}
}
window.addEventListener('pagehide', forfeitGame);

var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var CW=460,CH=560;cv.width=CW;cv.height=CH;
var TOTAL=10,PW=82,PH=40,PGAP=18,CX=CW/2,TOP_Y=55,BOT_Y=CH-55;
function sY(r){var span=(BOT_Y-36)-(TOP_Y+36);return (BOT_Y-36)-(r/(TOTAL-1))*span;}
function pRect(r,s){var y=sY(r);return{x:s===0?CX-PGAP/2-PW:CX+PGAP/2,y:y-PH/2,w:PW,h:PH};}
var G=null;
var STEP_TIME=10; // seconds per step — set in admin
var stepTimer=null, stepLeft=10;

function startStepTimer(){
  clearInterval(stepTimer);
  stepLeft=STEP_TIME;
  var fill=document.getElementById('stFill'), val=document.getElementById('stVal');
  fill.className='st-fill'; val.className='st-val';
  fill.style.width='100%'; val.textContent=STEP_TIME+'s';
  stepTimer=setInterval(function(){
    stepLeft--;
    val.textContent=stepLeft+'s';
    fill.style.width=(stepLeft/STEP_TIME*100)+'%';
    if(stepLeft<=3){fill.className='st-fill danger';val.className='st-val danger';}
    else if(stepLeft<=5){fill.className='st-fill warn';val.className='st-val warn';}
    if(stepLeft<=0){clearInterval(stepTimer);onStepTimeout();}
  },1000);
}
function stopStepTimer(){clearInterval(stepTimer);}

async function onStepTimeout(){
  // time ran out — end game, keep accumulated points
  if(!G||G.phase!=='play')return;
  G.phase='timeout';
  setCtrl(false);
  document.getElementById('ctrlBtns').style.display='none';
  const { data: res } = await db.rpc('bridge_end');
  if(res && res.ok) G.score = res.score;
  setTimeout(function(){
    showOv("Time's up!",G.score,'BACK TO DASHBOARD',false);
  },300);
}
function newG(){G={phase:'play',pat:[],rev:[],step:0,score:0,busy:false,x:CX,y:BOT_Y,alpha:1,falling:false,parts:[],shards:[]};}
function buildBar(){var el=document.getElementById('sb');el.innerHTML='';for(var i=0;i<TOTAL;i++){var d=document.createElement('div');d.className='pip';d.id='p'+i;el.appendChild(d);}}
function updBar(){for(var i=0;i<TOTAL;i++){var p=document.getElementById('p'+i);if(!p)continue;p.className='pip';if(i<G.step)p.classList.add('done');else if(i===G.step&&G.phase==='play')p.classList.add('cur');}}
function updHUD(){document.getElementById('hS').textContent=G.step+'/10';document.getElementById('hP').textContent=G.score;}

function draw(){
  ctx.clearRect(0,0,CW,CH);
  var bg=ctx.createLinearGradient(0,0,0,CH);bg.addColorStop(0,'#060d0b');bg.addColorStop(1,'#0a1410');ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);
  for(var i=1;i<8;i++){ctx.strokeStyle='rgba(46,196,182,'+(0.02+i*.006)+')';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(0,i*CH/8);ctx.lineTo(CW,i*CH/8);ctx.stroke();}
  drawRails();drawFinish();drawStart();drawPanels();drawShards();drawParts();if(G)drawMannequin(G.x,G.y,G.alpha);drawVig();
}
function drawRails(){var lx=CX-PGAP/2-PW-14,rx=CX+PGAP/2+PW+14;ctx.strokeStyle='rgba(46,196,182,0.2)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lx,BOT_Y-22);ctx.lineTo(lx-5,TOP_Y+22);ctx.stroke();ctx.beginPath();ctx.moveTo(rx,BOT_Y-22);ctx.lineTo(rx+5,TOP_Y+22);ctx.stroke();for(var r=0;r<TOTAL;r++){var y=sY(r);ctx.strokeStyle='rgba(46,196,182,0.07)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lx-3,y);ctx.lineTo(rx+3,y);ctx.stroke();}}
function drawFinish(){var fw=200,fh=34,fy=TOP_Y;ctx.fillStyle='rgba(46,196,182,0.12)';ctx.strokeStyle='#2ec4b6';ctx.lineWidth=1.5;ctx.beginPath();ctx.rect(CX-fw/2,fy-fh/2,fw,fh);ctx.fill();ctx.stroke();ctx.fillStyle='#2ec4b6';ctx.font="bold 12px 'Fredoka',sans-serif";ctx.textAlign='center';ctx.fillText('✦  FINISH  ✦',CX,fy+5);}
function drawStart(){var sw=200,sh=34,sy=BOT_Y;ctx.fillStyle='rgba(255,255,255,0.03)';ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.beginPath();ctx.rect(CX-sw/2,sy-sh/2,sw,sh);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.18)';ctx.font="bold 12px 'Fredoka',sans-serif";ctx.textAlign='center';ctx.fillText('START',CX,sy+5);}
function drawPanels(){
  if(!G)return;
  for(var r=0;r<TOTAL;r++){for(var s=0;s<2;s++){
    var rc=pRect(r,s),isSafe=G.pat[r]===s,isRev=G.rev.indexOf(r)>=0,isCur=r===G.step&&G.phase==='play';
    if(isRev&&!isSafe)continue;
    ctx.save();var fill,stroke,glow=null;
    if(isRev&&isSafe){fill='rgba(46,196,182,0.2)';stroke='#2ec4b6';glow='rgba(46,196,182,0.25)';}
    else if(isCur){var pulse=.08+Math.sin(Date.now()/350)*.05;fill='rgba(46,196,182,'+pulse+')';stroke='rgba(46,196,182,0.65)';glow='rgba(46,196,182,0.18)';}
    else{fill='rgba(46,196,182,0.06)';stroke='rgba(46,196,182,0.2)';}
    if(glow){ctx.shadowColor=glow;ctx.shadowBlur=12;}
    ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1.3;ctx.beginPath();ctx.rect(rc.x,rc.y,rc.w,rc.h);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;var sh2=ctx.createLinearGradient(rc.x,rc.y,rc.x+rc.w*.6,rc.y+rc.h*.6);sh2.addColorStop(0,'rgba(255,255,255,0.1)');sh2.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sh2;ctx.beginPath();ctx.rect(rc.x+2,rc.y+2,rc.w*.55,rc.h*.4);ctx.fill();
    ctx.fillStyle='rgba(46,196,182,0.25)';ctx.font='bold 9px Nunito,sans-serif';ctx.textAlign='center';ctx.fillText(r+1,rc.x+rc.w/2,rc.y+rc.h-5);
    if(isCur){ctx.fillStyle='rgba(46,196,182,0.55)';ctx.font='bold 18px Fredoka,sans-serif';ctx.textAlign='center';ctx.fillText('?',rc.x+rc.w/2,rc.y+rc.h/2+6);}
    ctx.restore();
  }}
  if(G.phase==='play'&&G.step<TOTAL){var lr=pRect(G.step,0),rr=pRect(G.step,1);ctx.fillStyle='rgba(46,196,182,0.45)';ctx.font='700 8px Nunito,sans-serif';ctx.textAlign='center';ctx.fillText('LEFT',lr.x+lr.w/2,lr.y-5);ctx.fillText('RIGHT',rr.x+rr.w/2,rr.y-5);}
}
function drawMannequin(x,y,alpha){
  ctx.save();ctx.globalAlpha=alpha||1;ctx.translate(x,y);
  ctx.shadowColor='rgba(46,196,182,0.3)';ctx.shadowBlur=16;ctx.strokeStyle='#2ec4b6';ctx.fillStyle='#2ec4b6';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=2.6;
  ctx.beginPath();ctx.arc(0,-19,6.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-10,-6);ctx.lineTo(10,-6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-10,-6);ctx.lineTo(-13,5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,-6);ctx.lineTo(13,5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-7,5);ctx.lineTo(7,5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-4,5);ctx.lineTo(-5,17);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,5);ctx.lineTo(5,17);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-5,17);ctx.lineTo(-9,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(5,17);ctx.lineTo(9,20);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(46,196,182,0.25)';ctx.lineWidth=1.2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
}
function drawShards(){if(!G)return;G.shards.forEach(function(s){ctx.save();ctx.globalAlpha=s.alpha;ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle='rgba(46,196,182,0.15)';ctx.strokeStyle='rgba(46,196,182,0.4)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s.w,s.h*.3);ctx.lineTo(s.w*.6,s.h);ctx.lineTo(-s.w*.2,s.h*.75);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();});}
function drawParts(){if(!G)return;G.parts.forEach(function(p){ctx.save();ctx.globalAlpha=p.alpha;ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=4;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();});}
function drawVig(){var g=ctx.createRadialGradient(CW/2,CH/2,CH*.3,CW/2,CH/2,CH*.85);g.addColorStop(0,'rgba(6,13,11,0)');g.addColorStop(1,'rgba(6,13,11,0.6)');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);}

async function start(){
  const { data: res } = await db.rpc('bridge_start');
  if(!res || !res.ok){
    document.getElementById('ovT').textContent = (res && res.reason==='already_played') ? 'Already played' : 'Bridge not available';
    document.getElementById('ovT').style.color = '#e8f0ee';
    document.getElementById('ovS').textContent = 'This bridge attempt is no longer available.';
    document.getElementById('ovP').textContent = '';
    var ob=document.getElementById('ovB'); ob.textContent='BACK TO DASHBOARD'; ob.onclick=function(){window.location.href='/dashboard.html';};
    document.getElementById('ov').classList.add('show');
    return;
  }
  BRIDGE_STEP = res.step_points; BRIDGE_FINISH = res.finish_bonus;
  gameActive = true;         // აქედან გამოსვლა = მიტოვება
  newG();buildBar();hideOv();document.getElementById('ctrlBtns').style.display='flex';document.getElementById('stepTimer').classList.add('show');setCtrl(true);updHUD();updBar();startStepTimer();
}
async function pick(side){
  if(!G||G.busy||G.phase!=='play')return;
  stopStepTimer();G.busy=true;setCtrl(false);
  var step=G.step,rc=pRect(step,side),tx=rc.x+rc.w/2,ty=rc.y+rc.h/2;
  var res;
  try{ const r = await db.rpc('bridge_step',{ p_side: side }); res = r.data; }catch(e){ res=null; }
  if(!res || !res.ok){ G.busy=false;setCtrl(true);startStepTimer(); return; }
  G.pat[step] = res.safe ? side : (1-side);   // მხოლოდ რენდერისთვის
  anim(tx,ty,380,function(){
    if(res.safe){
      G.score=res.score; G.step=res.step;
      if(res.win) onWin(step); else onSafe(step,side);
    } else {
      G.score=res.score; onFall(step,tx,ty);
    }
  });
}
function onSafe(step,side){G.rev.push(step);var op=pRect(step,1-side);spawnShards(op.x+op.w/2,op.y+op.h/2);spawnParts(op.x+op.w/2,op.y+op.h/2,'#e63946',8);updHUD();updBar();setTimeout(function(){G.busy=false;setCtrl(true);startStepTimer();},420);}
function onFall(step,px,py){G.rev.push(step);G.phase='dead';spawnShards(px,py);spawnParts(px,py,'#e63946',22);G.falling=true;var t0=performance.now(),sy=py,sx=px;(function fall(now){var t=Math.min((now-t0)/750,1);G.y=sy+t*t*440;G.x=sx+Math.sin(t*10)*6;G.alpha=1-t;if(t<1)requestAnimationFrame(fall);else{G.falling=false;setTimeout(function(){showOv('Game Over!',G.score,'BACK TO DASHBOARD',false);},300);}})(performance.now());}
function onWin(step){if(step!==undefined)G.rev.push(step);G.phase='win';updHUD();updBar();anim(CX,TOP_Y,500,function(){spawnParts(CX,TOP_Y,'#2ec4b6',30);spawnParts(CX,TOP_Y,'#f5c842',20);setTimeout(function(){showOv('You crossed\nthe bridge!',G.score,'BACK TO DASHBOARD',true);},700);});}
function anim(tx,ty,dur,cb){var fx=G.x,fy=G.y,t0=performance.now();(function tick(now){var t=Math.min((now-t0)/dur,1);var e=t<.5?2*t*t:-1+(4-2*t)*t;G.x=fx+(tx-fx)*e;G.y=fy+(ty-fy)*e;if(t<1)requestAnimationFrame(tick);else{G.x=tx;G.y=ty;if(cb)cb();}})(performance.now());}
function spawnShards(x,y){for(var i=0;i<10;i++)G.shards.push({x:x+(Math.random()-.5)*28,y:y+(Math.random()-.5)*18,vx:(Math.random()-.5)*4,vy:-(Math.random()*3+.5),rot:Math.random()*6.28,rv:(Math.random()-.5)*.2,alpha:.9,w:Math.random()*13+4,h:Math.random()*9+3});}
function spawnParts(x,y,c,n){for(var i=0;i<n;i++){var a=(i/n)*Math.PI*2,sp=Math.random()*3+1;G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,alpha:1,r:Math.random()*2.5+.5,c});}}
function update(){if(!G)return;if(!G.busy&&!G.falling&&G.phase==='play'){if(G.step===0){G.x=CX;G.y=BOT_Y;}else{var pr=pRect(G.step-1,G.pat[G.step-1]);G.x=pr.x+pr.w/2;G.y=pr.y+pr.h/2;}}G.parts=G.parts.filter(function(p){return p.alpha>.02;});G.parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.alpha-=.022;});G.shards=G.shards.filter(function(s){return s.alpha>.02;});G.shards.forEach(function(s){s.x+=s.vx;s.y+=s.vy;s.vy+=.1;s.rot+=s.rv;s.alpha-=.016;});}
function setCtrl(on){document.getElementById('bL').disabled=!on;document.getElementById('bR').disabled=!on;}
function showOv(t,pts,btn,win){stopStepTimer();document.getElementById('stepTimer').classList.remove('show');document.getElementById('ctrlBtns').style.display='none';var el=document.getElementById('ovT');el.innerHTML=t.replace('\n','<br>');el.style.color=win?'#2ec4b6':'#e8f0ee';document.getElementById('ovS').textContent='';var pe=document.getElementById('ovP');pe.style.display='block';pe.textContent='You earned '+pts+' pts!';var ob=document.getElementById('ovB');ob.textContent='BACK TO DASHBOARD';ob.onclick=function(){window.location.href='/dashboard.html';};document.getElementById('ov').classList.add('show');}
function hideOv(){document.getElementById('ov').classList.remove('show');}
G={phase:'idle',pat:[],rev:[],step:0,score:0,busy:false,x:CX,y:440,alpha:1,falling:false,parts:[],shards:[]};buildBar();
function loop(){if(G)update();draw();requestAnimationFrame(loop);}loop();
bridgeInit();
</script>
</body>
